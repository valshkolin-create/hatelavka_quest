<!-- Файл: /public/profile/promocodes.html -->
<div class="events-header-bar" style="margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
    
    <!-- Левая часть: Заголовок и счетчик (Шрифт 10px как в Событиях) -->
    <span style="font-size: 10px; font-weight: 900; color: var(--text-color-muted); text-transform: uppercase;">
        Промокоды <span id="promo-count-badge"></span>
    </span>
    
    <!-- Правая часть: Сортировка и кнопка очистки -->
    <div style="display: flex; align-items: center; gap: 6px;">
        <select id="promocodes-sort-select" class="events-sort-select" onchange="window.applyPromocodesSort()">
            <option value="date_desc">Сначала новые</option>
            <option value="auto">Сначала авто</option>
            <option value="manual">Сначала ручные</option>
            <option value="admin">От админа</option>
        </select>
        
        <button id="btn-clear-all-rewards" class="events-sort-select" style="display: none; background: rgba(255,69,58,0.1); color: #ff453a; border-color: rgba(255,69,58,0.3); cursor: pointer; padding: 2px 8px;" onclick="window.clearAllRewards()">
            <i class="fa-solid fa-trash" style="margin-right: 4px;"></i> Очистить всё
        </button>
    </div>

</div>

<!-- Контейнер для карточек -->
<div id="promocodes-list-container" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;"></div>

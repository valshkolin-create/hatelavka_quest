<!DOCTYPE html> 
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Достижения | Админка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f0f0f;
            --card-bg: rgba(30, 30, 30, 0.6);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #ffd700;
            --accent: #28a745;
            --danger: #ff4d4d;
            --text: #ffffff;
            --text-sec: #aaaaaa;
            --blur: 10px;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 20px;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 140px; 
            zoom: 0.85; 
        }

        /* ЛОКАЛЬНЫЙ ФИКС НИЖНЕГО БАРА */
        body .floating-bottom-bar { left: 0 !important; right: 0 !important; margin: 0 auto !important; transform: none !important; }
        ::selection { background: var(--primary); color: #000; }
        ::-moz-selection { background: var(--primary); color: #000; }

        /* --- Header --- */
        .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .page-title { font-size: 20px; font-weight: 800; margin: 0; background: linear-gradient(45deg, #fff, #bbb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .back-btn { background: none; border: none; color: var(--text-sec); font-size: 16px; cursor: pointer; transition: 0.2s; }
        .back-btn:active { color: var(--text); transform: scale(0.95); }

        .add-btn { background: rgba(255, 215, 0, 0.15); color: var(--primary); border: 1px solid rgba(255, 215, 0, 0.3); border-radius: 10px; padding: 8px 16px; font-size: 12px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; text-transform: uppercase; }
        .add-btn:active { transform: scale(0.95); background: rgba(255, 215, 0, 0.25); }

        /* --- Блоки и Карточки --- */
        .section-box { background: rgba(255,255,255,0.03); border-radius: 16px; padding: 15px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
        .sec-title { font-size: 13px; color: var(--primary); margin: 0 0 10px 0; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; display: flex; align-items: center; gap: 8px; }

        /* --- Формы --- */
        .admin-form input, .admin-form select, .admin-form textarea {
            width: 100%; box-sizing: border-box; background: var(--card-bg); border: 1px solid var(--card-border);
            color: var(--text); padding: 12px; border-radius: 12px; font-size: 14px; outline: none; transition: 0.2s;
            -webkit-appearance: none; -moz-appearance: none; appearance: none; font-family: inherit;
        }
        .admin-form select option { background-color: #1e1e1e; color: #ffffff; }
        .admin-form input:focus, .admin-form select:focus, .admin-form textarea:focus { border-color: var(--primary); background: rgba(255,255,255,0.03); }
        .admin-form label { display: block; font-size: 12px; color: var(--text-sec); margin: 12px 0 5px; font-weight: 500; }
        
        .admin-action-btn { background: var(--primary); color: #000; padding: 12px; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 20px; transition: 0.2s; text-transform: uppercase; }
        .admin-action-btn:active { transform: scale(0.98); }
        .admin-action-btn.danger { background: rgba(255,77,77,0.1); color: var(--danger); border: 1px solid rgba(255,77,77,0.3); }

        /* --- Списки --- */
        .ach-item { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); border-radius: 14px; padding: 12px; display: flex; gap: 12px; align-items: center; margin-bottom: 10px; cursor: pointer; transition: 0.2s; }
        .ach-item:active { transform: scale(0.98); background: rgba(255, 255, 255, 0.08); }
        .ach-img { width: 50px; height: 50px; border-radius: 10px; object-fit: contain; filter: drop-shadow(0 0 5px rgba(255,255,255,0.2)); }
        .ach-info { flex-grow: 1; min-width: 0; }
        .ach-title { font-size: 15px; font-weight: 800; color: #fff; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ach-desc { font-size: 11px; color: var(--text-sec); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .ach-meta { font-size: 9px; font-weight: 800; color: #64b5ef; margin-top: 6px; text-transform: uppercase; }
        
        .color-preview { width: 12px; height: 12px; display: inline-block; border-radius: 50%; vertical-align: middle; margin-right: 4px; border: 1px solid rgba(255,255,255,0.3); }

        /* --- Модальные окна (Bottom Sheet) --- */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; display: none; align-items: flex-end; justify-content: center; backdrop-filter: blur(5px); }
        .modal-active { display: flex; animation: fadeIn 0.3s ease; }
        .bottom-sheet { background: #1c1c1e; width: 100%; border-radius: 24px 24px 0 0; padding: 20px; padding-bottom: 110px; max-height: 85vh; display: flex; flex-direction: column; box-sizing: border-box; border-top: 1px solid var(--card-border); overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        
        #mainLoader { text-align: center; padding: 40px; color: var(--text-sec); }
        .hidden { display: none !important; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="main-content-scrollable">
        <div class="page-header">
            <h1 class="page-title"><i class="fa-solid fa-trophy" style="color: var(--primary);"></i> Достижения</h1>
            <button class="add-btn" onclick="openModal('achModal', null)">
                <i class="fa-solid fa-plus"></i> Создать
            </button>
        </div>

        <div id="mainLoader">
            <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
            <p style="margin-top: 10px; font-size: 13px;">Загрузка базы...</p>
        </div>

        <div id="achievementsContainer" class="hidden">
            <div id="achievementsList"></div>
        </div>
    </div>

    <!-- МОДАЛКА: СОЗДАНИЕ / РЕДАКТИРОВАНИЕ -->
    <div id="achModal" class="modal-overlay" onclick="closeOnDim(event)">
        <div class="bottom-sheet admin-form">
            <div class="modal-header">
                <h3 id="modalTitle" style="margin:0; font-size: 18px; font-weight: 800; color: #fff;">Новое достижение</h3>
                <button class="back-btn" onclick="closeModal('achModal')"><i class="fa-solid fa-xmark" style="font-size: 20px;"></i></button>
            </div>
            
            <input type="hidden" id="achId">

            <label>Название (Отображается юзеру)</label>
            <input type="text" id="achTitle" placeholder="Например: Ветеран Твича" autocomplete="off">

            <label>Описание</label>
            <textarea id="achDesc" rows="3" placeholder="Что нужно сделать, чтобы получить..."></textarea>

            <label>Картинка (URL)</label>
            <input type="url" id="achImage" placeholder="https://imgur.com/...png">

            <label>Цвет свечения (HEX, RGB, RGBA)</label>
            <input type="text" id="achGlow" placeholder="Например: #ffd700 или rgba(255, 0, 0, 0.8)">
            
            <div style="background: rgba(100, 181, 239, 0.1); border: 1px dashed rgba(100, 181, 239, 0.3); border-radius: 12px; padding: 12px; margin-top: 15px; margin-bottom: 5px;">
                <label style="margin-top: 0; color: #64b5ef;">Поле в таблице users (Условие)</label>
                <input type="text" id="achType" placeholder="Например: total_uptime_minutes" style="border-color: rgba(100, 181, 239, 0.4);">
                
                <label style="color: #64b5ef;">Значение (Сколько нужно набрать)</label>
                <input type="number" id="achValue" placeholder="Например: 6000" style="border-color: rgba(100, 181, 239, 0.4);">
            </div>

            <button id="saveBtn" class="admin-action-btn" onclick="saveAchievement()">Сохранить</button>
            <button id="deleteBtn" class="admin-action-btn danger hidden" onclick="deleteAchievement()" style="margin-top: 10px;">Удалить достижение</button>
        </div>
    </div>

    <!-- Кастомный Confirm -->
    <div id="customConfirmModal" class="modal-overlay" style="z-index: 2000; align-items: center; justify-content: center;">
        <div style="background: var(--bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 20px; width: 85%; max-width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <h3 id="confirmTitle" style="margin-top: 0; font-size: 16px; color: var(--text);">Подтверждение</h3>
            <p id="confirmMessage" style="font-size: 13px; color: var(--text-sec); margin-bottom: 20px;"></p>
            <div style="display: flex; gap: 10px;">
                <button id="confirmBtnNo" style="flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); color: var(--text); padding: 10px; border-radius: 10px; font-weight: 600; cursor: pointer;">Отмена</button>
                <button id="confirmBtnYes" class="admin-action-btn danger" style="flex: 1; margin: 0; padding: 10px;">Да</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.BackButton.show();
        tg.BackButton.onClick(() => window.location.href = '/admin');

        // Глобальная функция для запросов (копия из твоей админки)
        window.makeApiRequest = async function(endpoint, method = 'POST', data = null) {
            let url = endpoint;
            const options = { method: method.toUpperCase(), headers: { 'Content-Type': 'application/json' } };

            if (options.method === 'GET') {
                url += (url.includes('?') ? '&' : '?') + `initData=${encodeURIComponent(tg.initData)}`;
            } else {
                const bodyData = data || {};
                bodyData.initData = tg.initData;
                options.body = JSON.stringify(bodyData);
            }

            const res = await fetch(url, options);
            const resData = await res.json();
            if (!res.ok) throw new Error(resData.detail || 'Ошибка API');
            return resData;
        };

        function customConfirm(message, title = "Внимание") {
            return new Promise((resolve) => {
                if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                const modal = document.getElementById('customConfirmModal');
                document.getElementById('confirmTitle').textContent = title;
                document.getElementById('confirmMessage').textContent = message;
                modal.classList.add('modal-active');

                document.getElementById('confirmBtnYes').onclick = () => { modal.classList.remove('modal-active'); resolve(true); };
                document.getElementById('confirmBtnNo').onclick = () => { modal.classList.remove('modal-active'); resolve(false); };
            });
        }

        function openModal(id, achData = null) { 
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            
            const isEdit = achData !== null;
            document.getElementById('modalTitle').innerText = isEdit ? 'Редактировать ачивку' : 'Создать ачивку';
            document.getElementById('saveBtn').innerText = isEdit ? 'Сохранить изменения' : 'Создать';
            
            const delBtn = document.getElementById('deleteBtn');
            if (isEdit) delBtn.classList.remove('hidden');
            else delBtn.classList.add('hidden');

            document.getElementById('achId').value = isEdit ? achData.id : '';
            document.getElementById('achTitle').value = isEdit ? achData.title : '';
            document.getElementById('achDesc').value = isEdit ? (achData.description || '') : '';
            document.getElementById('achImage').value = isEdit ? (achData.image_url || '') : '';
            document.getElementById('achGlow').value = isEdit ? (achData.glow_color || 'rgba(255, 255, 255, 0.5)') : 'rgba(255, 215, 0, 0.8)';
            document.getElementById('achType').value = isEdit ? (achData.condition_type || '') : '';
            document.getElementById('achValue').value = isEdit ? (achData.condition_value || 0) : 0;

            document.getElementById(id).classList.add('modal-active'); 
        }

        function closeModal(id) { 
            document.getElementById(id).classList.remove('modal-active'); 
        }

        function closeOnDim(e) { 
            if(e.target.classList.contains('modal-overlay')) e.target.classList.remove('modal-active'); 
        }

        async function loadData() {
            try {
                const data = await window.makeApiRequest('/api/v1/admin/achievements', 'GET');
                renderList(data);
            } catch (err) {
                tg.showAlert("Ошибка: " + err.message);
            } finally {
                document.getElementById('mainLoader').classList.add('hidden');
                document.getElementById('achievementsContainer').classList.remove('hidden');
            }
        }

        function renderList(items) {
            const list = document.getElementById('achievementsList');
            if (!items || items.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:var(--text-sec); padding:20px;">Нет ни одного достижения. Создай первое!</div>';
                return;
            }

            list.innerHTML = items.map(ach => {
                const safeJson = encodeURIComponent(JSON.stringify(ach).replace(/'/g, "&apos;"));
                return `
                    <div class="ach-item" onclick="openModal('achModal', JSON.parse(decodeURIComponent('${safeJson}'.replace(/&apos;/g, \\"'\\"))))" style="box-shadow: 0 0 10px ${ach.glow_color}20; border-color: ${ach.glow_color}40;">
                        <img src="${ach.image_url || 'https://placehold.co/100x100/1e1e1e/ffffff?text=?'}" class="ach-img">
                        <div class="ach-info">
                            <div class="ach-title" style="color: ${ach.glow_color}; text-shadow: 0 0 8px ${ach.glow_color}80;">${ach.title}</div>
                            <div class="ach-desc">${ach.description || 'Без описания'}</div>
                            <div class="ach-meta"><i class="fa-solid fa-code"></i> ${ach.condition_type} >= ${ach.condition_value}</div>
                        </div>
                        <i class="fa-solid fa-chevron-right" style="color: var(--text-sec); font-size: 12px; margin-left: 10px;"></i>
                    </div>
                `;
            }).join('');
        }

        async function saveAchievement() {
            const id = document.getElementById('achId').value;
            const payload = {
                title: document.getElementById('achTitle').value.trim(),
                description: document.getElementById('achDesc').value.trim(),
                image_url: document.getElementById('achImage').value.trim(),
                glow_color: document.getElementById('achGlow').value.trim(),
                condition_type: document.getElementById('achType').value.trim(),
                condition_value: parseInt(document.getElementById('achValue').value) || 0
            };

            if (!payload.title || !payload.condition_type) return tg.showAlert("Заполни название и условие!");

            tg.MainButton.showProgress();
            try {
                if (id) {
                    // Редактирование
                    payload.id = parseInt(id);
                    await window.makeApiRequest('/api/v1/admin/achievements/update', 'POST', payload);
                    tg.showPopup({message: 'Успешно обновлено!'});
                } else {
                    // Создание
                    await window.makeApiRequest('/api/v1/admin/achievements/create', 'POST', payload);
                    tg.showPopup({message: 'Достижение создано!'});
                }
                closeModal('achModal');
                loadData();
            } catch (err) {
                tg.showAlert("Ошибка: " + err.message);
            } finally {
                tg.MainButton.hideProgress();
            }
        }

        async function deleteAchievement() {
            const id = document.getElementById('achId').value;
            if (!id) return;

            const isConfirmed = await customConfirm("Точно удалить это достижение? Оно пропадет у всех игроков, кто его получил.");
            if (!isConfirmed) return;

            tg.MainButton.showProgress();
            try {
                await window.makeApiRequest('/api/v1/admin/achievements/delete', 'POST', { id: parseInt(id) });
                tg.showPopup({message: 'Удалено!'});
                closeModal('achModal');
                loadData();
            } catch (err) {
                tg.showAlert("Ошибка: " + err.message);
            } finally {
                tg.MainButton.hideProgress();
            }
        }

        // Старт
        loadData();
    </script>
    <script src="/top_nav.js" defer></script>
    <script src="/bottom-nav.js" defer></script>
</body>
</html>

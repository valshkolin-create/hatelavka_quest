<!-- Файл: /public/profile/promocodes.html -->
<div class="events-header-bar" style="margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; padding: 0 4px; gap: 8px;">
    
    <!-- Левая часть: СОРТИРОВКА (1в1 как в Инвентаре) -->
    <div style="font-size: 11px; font-weight: 800; color: var(--text-color-muted); text-transform: uppercase; letter-spacing: 0.5px;">Сортировка</div>
    
    <!-- Правая часть: Сортировка и идеально оцентрованная кнопка очистки -->
    <div style="display: flex; align-items: center; gap: 6px;">
        <select id="promocodes-sort-select" class="events-sort-select" onchange="window.applyPromocodesSort()">
            <option value="date_desc">Сначала новые</option>
            <option value="auto">Сначала авто</option>
            <option value="manual">Сначала ручные</option>
            <option value="admin">От админа</option>
        </select>
        
        <!-- Добавлен flex для жесткой центровки текста и иконки + height 24px -->
        <button id="btn-clear-all-rewards" class="events-sort-select" style="display: none; align-items: center; justify-content: center; gap: 5px; height: 24px; padding: 0 10px; background: rgba(255,69,58,0.1); color: #ff453a; border-color: rgba(255,69,58,0.3); cursor: pointer; text-align: center; font-family: inherit;" onclick="window.clearAllRewards()">
            <i class="fa-solid fa-trash"></i> Очистить всё
        </button>
        
        <!-- Скрытый бейдж, чтобы твой JS не выдал ошибку при попытке обновить цифру -->
        <span id="promo-count-badge" style="display: none;"></span>
    </div>

</div>

<!-- Контейнер для карточек -->
<div id="promocodes-list-container" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;"></div>

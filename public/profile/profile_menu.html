<!DOCTYPE html>
<html lang="ru">
<head>  
    <meta charset="UTF-8" />
    <title>Профиль | HATElavka SPA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --text-color-muted: #ebebf5;
            --primary-color: #34c759;
            --action-color: #0a84ff;
            --danger-color: #ff453a;
            
            /* iOS Liquid Glass Variables */
            --glass-bg: rgba(28, 28, 30, 0.45);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --glass-blur: blur(25px);
            
            --safe-top-gap: max(env(safe-area-inset-top, 24px) + 20px, 40px);
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); /* СТРОГО ЧЕРНЫЙ ФОН ИЗ ТЗ */
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Arial, sans-serif;
            overflow: hidden; 
            -webkit-tap-highlight-color: transparent;
        }

        .profile-skeleton {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* --- LIQUID GLASS HEADER --- */
        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between; /* Раскидываем инфо и историю */
            padding: var(--safe-top-gap) 15px 20px 15px;
            gap: 15px;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            z-index: 10;
        }

        .avatar-container {
            width: 75px;
            height: 75px;
            border-radius: 22px; /* iOS squircle */
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            flex-shrink: 0;
            background: #1c1c1e;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1;
        }

        .user-icons {
            font-size: 16px;
            margin-bottom: 4px;
            display: flex;
            gap: 10px;
        }
        
        .user-icons i {
            cursor: pointer;
            transition: transform 0.2s, color 0.3s ease;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        
        .user-icons i:active { transform: scale(0.8); }

        .nickname {
            color: var(--danger-color); /* КРАСНЫЙ НИК КАК НА СКРИНШОТЕ */
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .user-id {
            color: #b0b0b0;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .settings-btn {
            background-color: #1c1c1e;
            color: #fff;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 4px 12px;
            font-size: 10px;
            font-weight: 700;
            text-transform: lowercase;
            cursor: pointer;
            width: fit-content;
            transition: all 0.2s;
        }
        .settings-btn:active { transform: scale(0.95); background: #2c2c2e; }

        /* ВЕРНУЛИ ИСТОРИЮ КАК НА СКРИНШОТЕ */
        .history-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .history-title {
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .history-slots {
            display: flex;
            gap: 5px;
        }

        .h-slot {
            width: 32px;
            height: 32px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* --- LIQUID GLASS NAV --- */
        .nav-bar {
            display: flex;
            background: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            padding: 5px 10px;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 5;
        }

        .nav-item {
            flex: 1;
            text-align: center;
            font-size: 10px;
            font-weight: 800;
            color: rgba(255,255,255,0.5);
            padding: 12px 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            line-height: 1.1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
        }

        .nav-item.active {
            color: var(--danger-color); /* Красный цвет активной вкладки */
            font-weight: 800;
            text-shadow: 0 0 10px rgba(255,69,58,0.3);
        }
        
        /* --- CONTENT AREA --- */
        #content-area {
            flex-grow: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 15px;
            position: relative;
        }

        .tab-loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: var(--text-color-muted);
            font-size: 28px;
        }
        
        /* --- LIQUID GLASS MODAL (SETTINGS) --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: 10000; display: flex; align-items: flex-end; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.visible { opacity: 1; pointer-events: auto; }
        
        .bottom-sheet {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-top: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            width: 100%; border-radius: 28px 28px 0 0;
            padding: 24px 20px 40px 20px;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .modal-overlay.visible .bottom-sheet { transform: translateY(0); }

        .sheet-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px;
        }
        .sheet-title { font-size: 20px; font-weight: 800; margin: 0; }
        .sheet-close {
            background: rgba(255,255,255,0.1); border: none; color: #fff;
            width: 32px; height: 32px; border-radius: 16px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* Карточки внутри настроек */
        .settings-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 16px;
            margin-bottom: 15px; display: flex; flex-direction: column; gap: 12px;
        }
        .settings-card-row { display: flex; justify-content: space-between; align-items: center; }
        
        .settings-icon-title { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; }
        .settings-status-text { font-size: 13px; color: var(--text-color-muted); word-break: break-all; }
        
        .ios-input {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; padding: 12px 15px; border-radius: 12px; font-size: 13px; outline: none;
            box-sizing: border-box; transition: 0.3s;
        }
        .ios-input:focus { border-color: var(--action-color); background: rgba(0,0,0,0.5); }
        .ios-input.error { border-color: var(--danger-color); box-shadow: 0 0 10px rgba(255,69,58,0.3); }

        .ios-btn {
            border: none; padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 700;
            cursor: pointer; transition: transform 0.2s; color: #fff;
        }
        .ios-btn:active { transform: scale(0.95); }
        .btn-twitch { background: #9146ff; }
        .btn-steam { background: var(--action-color); }
        .btn-danger { background: rgba(255,69,58,0.15); color: var(--danger-color); border: 1px solid rgba(255,69,58,0.3); }

        /* Loader Overlay (Global) */
        #global-loader {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
            z-index: 99999; display: none; align-items: center; justify-content: center;
        }
        #global-loader.active { display: flex; }
    </style>
</head>
<body>

    <div id="global-loader"><i class="fa-solid fa-circle-notch fa-spin" style="font-size: 40px; color: #fff;"></i></div>

    <div class="profile-skeleton">

        <header class="profile-header">

        <!-- DYNAMIC CONTENT AREA -->
        <main id="content-area">
        </main>
    </div>

                <button class="sheet-close" onclick="closeSettings()"><i class="fa-solid fa-xmark"></i></button>

            <!-- Блок Twitch -->
            <div class="settings-card">
                <div class="settings-card-row">
                    <div class="settings-icon-title">
                        <i class="fa-brands fa-twitch" style="color: #9146ff; font-size: 20px;"></i>
                        Twitch Аккаунт
                    </div>
                </div>
                <div class="settings-card-row">
                    <div class="settings-status-text" id="twitch-status-text">Загрузка...</div>
                    <div id="twitch-action-btn-container">

                </div>

            <!-- Блок Steam Trade Link -->
            <div class="settings-card">
                <div class="settings-card-row" style="margin-bottom: 5px;">

                <div>
                    <input type="url" id="trade-link-input" class="ios-input" placeholder="https://steamcommunity.com/tradeoffer/new/..." autocomplete="off">
                </div>
                <div style="display: flex; justify-content: flex-end; margin-top: 5px;">
                    <button class="ios-btn btn-steam" onclick="saveTradeLink()">Сохранить ссылку</button>
                </div>
            </div>
        </div>
    </div>

    <script>

        tg.ready();
        tg.expand();

        let currentUserData = null; 

        // --- УТИЛИТА ДЛЯ API ---
        async function apiRequest(endpoint, method = 'POST', body = null) {
            let url = endpoint;
            const options = { method, headers: { 'Content-Type': 'application/json' } };
            
            if (method === 'GET') {
                url += (url.includes('?') ? '&' : '?') + `initData=${encodeURIComponent(tg.initData)}`;
            } else {
                const b = body || {};
                b.initData = tg.initData;
                options.body = JSON.stringify(b);
            }
            
            const res = await fetch(url, options);
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Ошибка сервера');
            return data;
        }

true,"referrer_id":477521935,"referral_activated_at":"2026-01-27 17:08:16.63342+03","bott_ref_id":23662302,"last_balance_sync":"2026-08-03 17:12:20.295139+03","referrals_count":138,"twitch_status":"error","twitch_access_token":"s7baj0jwj9uk28hgcqa52ofof4smym","twitch_refresh_token":"4fv5jrr639a5g6phzfq141k8zpd8t1eogg0eszxi8bp160v150","last_twitch_sync":"2026-08-03 16:00:34.62654+03","last_mystery_box_at":null,"last_new_year_gift_at":"2026-04-13 08:55:11.938581+03","vk_id":null,"platform":"tg","is_banned":false,"trust_level":"green","trust_score":"100.0","prev_monthly_message_count":799,"prev_monthly_uptime_minutes":5000,"prev_telegram_monthly_message_count":0,"penalty_points":"6.0","amnesty_used_at":null,"amnesty_bonus":"70.0","monthly_quest_bonus":"0","has_cp_premium":false,"topskin_views":2,"has_accepted_oferta":true,"device_id":"e7e39385-4c1a-41c3-b630-1aaf17507d8d","last_ip":"2.26.0.193","platform_type":null,"is_admin":false};

                const hasSteam = !!currentUserData.trade_link;

        }

        // --- ЛОГИКА СИСТЕМНОЙ КНОПКИ НАЗАД ---
        tg.BackButton.show();
        tg.BackButton.onClick(() => {
            const settingsModal = document.getElementById('settings-modal');
            
            // Если открыто окно настроек — закрываем его
            if (settingsModal.classList.contains('visible')) {
                closeSettings();
            } else {
                // Если окон нет, возвращаемся в предыдущее меню (или по истории браузера)
                if (window.history.length > 1 && document.referrer) {
                    window.history.back();
                } else {
                    window.location.href = '/menu'; // Замени на нужный URL возврата
                }
            }
        });

        // --- ЛОГИКА НАСТРОЕК (1 В 1 СТАРЫЙ КОД) ---
        function openSettings() {
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            document.getElementById('settings-modal').classList.add('visible');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('visible');
        }

        async function saveTradeLink() {
            const input = document.getElementById('trade-link-input');
            let val = input.value.trim();
            
            if (!val.startsWith("https://steamcommunity.com/tradeoffer/new") || !val.includes("partner=") || !val.includes("token=")) {
                input.classList.add('error');
                tg.showAlert("Укажите правильную Trade-ссылку из Steam!");
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                return;
            }
            
            input.classList.remove('error');
            document.getElementById('global-loader').classList.add('active');

            try {
                // БОЕВОЙ ЗАПРОС (Перенесли твой 1в1)
                // await apiRequest('/api/v1/user/trade_link/save', 'POST', { trade_link: val });
                
                currentUserData.trade_link = val;
                document.getElementById('icon-steam').style.color = 'var(--primary-color)';
                
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                tg.showPopup({message: 'Trade Link успешно сохранен!'});
                closeSettings();
            } catch (err) {
                tg.showAlert("Ошибка: " + err.message);
            } finally {
                document.getElementById('global-loader').classList.remove('active');
            }
        }

        async function connectTwitch() {
            document.getElementById('global-loader').classList.add('active');
            try {
                // БОЕВОЙ ЗАПРОС OAuth (Перенесли твой 1в1)
                // const res = await fetch(`/api/v1/auth/twitch_oauth?initData=${encodeURIComponent(tg.initData)}`);
                // const data = await res.json();
                // tg.openLink(data.url);
                // setTimeout(() => tg.close(), 500);

                setTimeout(() => {
                    tg.showAlert("Здесь откроется OAuth ссылка Twitch (включи боевой запрос в коде)");
                    document.getElementById('global-loader').classList.remove('active');
                }, 500);

            } catch (err) {
                document.getElementById('global-loader').classList.remove('active');
                tg.showAlert("Ошибка: " + err.message);
            }
        }

        async function unlinkTwitch() {
            if (!confirm("Отвязать Twitch аккаунт?")) return;
            
            document.getElementById('global-loader').classList.add('active');
            try {
                // БОЕВОЙ ЗАПРОС (Перенесли твой 1в1)
                // await apiRequest('/api/v1/user/twitch/unlink', 'POST');
                
                currentUserData.twitch_login = null;
                document.getElementById('icon-twitch').style.color = 'var(--danger-color)';
                
                document.getElementById('twitch-status-text').innerText = `Аккаунт не привязан`;
                document.getElementById('twitch-action-btn-container').innerHTML = `<button class="ios-btn btn-twitch" onclick="connectTwitch()">Привязать</button>`;
                
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } catch (err) {
                tg.showAlert("Ошибка: " + err.message);
            } finally {
                document.getElementById('global-loader').classList.remove('active');
            }
        }

// --- ЛОГИКА БЕСШОВНОЙ ПОДГРУЗКИ (SPA РОУТЕР) ---
        const navItems = document.querySelectorAll('.nav-item');
        const contentArea = document.getElementById('content-area');

        async function loadTab(tabName) {
            // Показываем крутилку загрузки вкладки
            contentArea.innerHTML = '<div class="tab-loader"><i class="fa-solid fa-circle-notch fa-spin"></i></div>';
            
            try {
                // 1. БОЕВОЙ FETCH: Подгружаем HTML-файл
                // (Если вкладка inventory, грузим profile_inventory.html, иначе по имени вкладки)
                const fileName = tabName === 'inventory' ? 'profile_inventory' : tabName;
                const response = await fetch(`/public/profile/${fileName}.html`);
                
                if (!response.ok) throw new Error("Файл не найден");
                const html = await response.text();
                
                // Вставляем макет в наш контейнер
                contentArea.innerHTML = html;

                // 2. ЕСЛИ ЗАГРУЗИЛСЯ ИНВЕНТАРЬ - ДОСТАЕМ СКИНЫ ИЗ БАЗЫ!
                if (tabName === 'inventory') {
                    const invContainer = document.getElementById('inventory-list-container');
                    if (invContainer) {
                        invContainer.innerHTML = '<div style="text-align: center; color: rgba(255,255,255,0.5); margin-top: 50px;"><i class="fa-solid fa-circle-notch fa-spin" style="margin-bottom: 10px; font-size: 32px; color: #0a84ff;"></i><br>Связь с базой данных...</div>';
                    }
                    
                    try {
                        // Делаем реальный запрос к твоему API за скинами
                        const inventoryData = await apiRequest("/api/v1/user/inventory", "POST");
                        // Отдаем скины нашей функции отрисовки
                        renderInventory(inventoryData);
                    } catch (err) {
                        if (invContainer) invContainer.innerHTML = `<div style="text-align:center; color:var(--danger-color); margin-top:50px;">Ошибка загрузки предметов:<br>${err.message}</div>`;
                    }
                }

            } catch (error) {
                contentArea.innerHTML = `<div style="text-align:center; color:var(--danger-color); padding-top: 50px;">Ошибка загрузки раздела: ${error.message}</div>`;
            }
        }

        navItems.forEach(item => {
            item.addEventListener('click', function() {
                navItems.forEach(nav => nav.classList.remove('active'));
                this.classList.add('active');
                const targetTab = this.getAttribute('data-target');
                loadTab(targetTab);
                if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            });
        });

        // Запуск приложения
        fetchAndApplyUserData().then(() => {
            // Грузим Инвентарь по умолчанию (он первый в меню)
            loadTab('inventory');
        });

        // =========================================================
        // ЛОГИКА ИНВЕНТАРЯ (ИЗ СТАРОГО КОДА, АДАПТИРОВАНА ПОД SPA)
        // =========================================================
        
        let isUpdating = false;
        let inventoryRefreshInterval = null;
        window.currentInventoryItems = [];
        const checkCooldowns = {};

        function applyInventorySort() {
            renderInventory(window.currentInventoryItems, true);
        }

        function getRarityData(rarity) {
            const r = (rarity || '').toLowerCase();
            if (r.includes('gold') || r.includes('крайне') || r.includes('knife')) return { color: '#ffd700', name: 'Крайне редкий' };
            if (r.includes('contraband') || r.includes('контрабандное')) return { color: '#e4ae39', name: 'Контрабандное' };
            if (r.includes('red') || r.includes('covert') || r.includes('ancient') || r.includes('тайное')) return { color: '#eb4b4b', name: 'Тайное' };
            if (r.includes('pink') || r.includes('classified') || r.includes('legendary') || r.includes('засекреченное')) return { color: '#d32ce6', name: 'Засекреченное' };
            if (r.includes('purple') || r.includes('restricted') || r.includes('mythical') || r.includes('запрещенное')) return { color: '#8847ff', name: 'Запрещённое' };
            if (r.includes('industrial') || r.includes('light_blue') || r.includes('промышленное')) return { color: '#5e98d9', name: 'Промышленное качество' };
            if (r.includes('blue') || r.includes('mil-spec') || r.includes('rare') || r.includes('армейское')) return { color: '#4b69ff', name: 'Армейское качество' };
            return { color: '#b0c3d9', name: 'Ширпотреб' };
        }

        function parseSafeDate(dateStr) {
            if (!dateStr) return 0;
            if (typeof dateStr === 'number') return dateStr;
            let ms = new Date(dateStr).getTime();
            if (!isNaN(ms)) return ms;
            try {
                let cleanPart = String(dateStr).split('.')[0].split('+')[0];
                let safe = cleanPart.replace(' ', 'T');
                ms = new Date(safe).getTime();
                return isNaN(ms) ? 0 : ms;
            } catch(e) { return 0; }
        }

        function initCountdown(elementId, updatedAtStr) {
            const el = document.getElementById(elementId);
            if (!el) return;
            let dateStr = updatedAtStr.replace(' ', 'T');
            if (!dateStr.endsWith('Z') && !dateStr.includes('+')) dateStr += 'Z';
            
            const updateTime = new Date(dateStr).getTime();
            if (isNaN(updateTime)) { el.innerHTML = "ОБРАБОТКА..."; return; }
            
            const expireTime = updateTime + (30 * 60 * 1000); 
            const historyId = elementId.replace('timer-', '');
            const getDistance = () => expireTime - new Date().getTime();

            if (getDistance() < 0) {
                el.innerHTML = `<span style="color:#ffcc00; font-size:10px;"><i class="fa-solid fa-clock"></i> ВРЕМЯ ВЫШЛО</span>`;
                if (el.dataset.intervalId) clearInterval(el.dataset.intervalId);
                return;
            }

            const updateTimer = () => {
                const distance = getDistance();
                if (distance < 0) {
                    el.innerHTML = `<span style="color:#34c759; font-size:10px;"><i class="fa-solid fa-circle-notch fa-spin"></i> ПРОВЕРЯЕМ...</span>`;
                    clearInterval(el.dataset.intervalId);
                    checkTradeStatus(historyId, true);
                    return;
                }
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                el.innerHTML = `<i class="fa-solid fa-clock-rotate-left"></i> ${minutes}м ${seconds < 10 ? '0' + seconds : seconds}с`;
            };

            if (el.dataset.intervalId) clearInterval(el.dataset.intervalId);
            updateTimer();
            el.dataset.intervalId = setInterval(updateTimer, 1000);
        }

        // --- РЕНДЕР ИНВЕНТАРЯ ---
        function renderInventory(items, isSorting = false) {
            const container = document.getElementById('inventory-list-container');
            if(!container) return; // Защита, если вкладка еще не загружена

            if (!isSorting) window.currentInventoryItems = items || [];
            const itemsToRender = [...window.currentInventoryItems];

            container.innerHTML = '';
            container.className = 'inventory-grid';

            let availableSellCount = 0;
            let totalSellTickets = 0.0;

            if (itemsToRender.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align:center; padding-top: 50px;">
                        <i class="fa-solid fa-box-open" style="font-size: 40px; margin-bottom: 15px; opacity: 0.3; color: #fff;"></i>
                        <p style="font-size: 14px; color: rgba(255,255,255,0.6); font-weight: 600;">Инвентарь пуст</p>
                    </div>`;
                container.classList.remove('inventory-grid'); 
                return;
            }

            const sortSelect = document.getElementById('inventory-sort-select');
            const sortType = sortSelect ? sortSelect.value : 'date_desc';

            const statusWeight = { 
                'auto_queued': 1, 'market_pending': 2, 'sent': 3, 'offer_sent': 4, 'pending': 5,
                'available': 6, 'processing': 7, 'failed': 8, 'canceled': 9,
                'received': 10, 'exchanged': 11, 'exchanged_swap': 12
            };

            itemsToRender.sort((a, b) => {
               const dateA = parseSafeDate(a.created_at || a.updated_at || a.date);
               const dateB = parseSafeDate(b.created_at || b.updated_at || b.date);
               const priceA = parseFloat(a.price_rub || a.price || 0);
               const priceB = parseFloat(b.price_rub || b.price || 0);
               const statA = (a.status || 'available').toLowerCase();
               const statB = (b.status || 'available').toLowerCase();
               const weightA = statusWeight[statA] || 99;
               const weightB = statusWeight[statB] || 99;

                if (sortType === 'status') {
                    if (weightA !== weightB) return weightA - weightB;
                    return dateB - dateA; 
                }
                
                const isAArchived = weightA >= 10;
                const isBArchived = weightB >= 10;
                if (isAArchived && !isBArchived) return 1;
                if (!isAArchived && isBArchived) return -1;

                if (sortType === 'date_desc') return dateB - dateA;
                if (sortType === 'date_asc') return dateA - dateB;
                if (sortType === 'price_desc') return priceB - priceA;
                if (sortType === 'price_asc') return priceA - priceB;
                return dateB - dateA;
            });

            itemsToRender.forEach(item => {
                const status = (item.status || 'available').toLowerCase();
                const historyId = item.id || item.history_id; 

                if (['available', 'pending', 'failed', 'canceled', 'received'].includes(status)) {
                    localStorage.removeItem(`claim_lock_${historyId}`);
                }

                const rData = getRarityData(item.rarity); 
                const isSwapped = item.is_swapped === true;
                const isReplaced = !!item.replaced_name && !isSwapped; 
                
                let displayName = (isReplaced || isSwapped) ? item.replaced_name : item.name;
                if (!displayName && item.details && item.details.includes('Выигрыш:')) {
                    displayName = item.details.replace('Выигрыш:', '').split('||')[0].trim();
                }
                if (!displayName) displayName = "Секретный приз";
                
                let imageUrl = item.image_url;
                if (!imageUrl || imageUrl.includes('null')) imageUrl = 'https://placehold.co/100x100/18181b/3f3f46?text=?';
                
                let strPrice = String(item.price_rub || item.price || "0").replace(',', '.');
                let strReplaced = String(item.replaced_price || "0").replace(',', '.');
                let parsedBasePrice = parseFloat(strPrice) || 0;
                let parsedReplPrice = parseFloat(strReplaced) || 0;
                const rawPrice = (isReplaced || isSwapped) && parsedReplPrice > 0 ? parsedReplPrice : parsedBasePrice;
                const ticketVal = parseFloat((rawPrice * 0.5).toFixed(2));

                if (['available', 'pending', 'failed', 'canceled'].includes(status)) {
                    availableSellCount++;
                    totalSellTickets += ticketVal;
                }

                const imageContentHtml = isReplaced 
                    ? `<i class="fa-solid fa-right-left" style="font-size: 24px; color: #FFD700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);"></i>`
                    : `<img src="${imageUrl}" loading="lazy" decoding="async">`;

                const timestamp = parseSafeDate(item.created_at || item.updated_at || item.date);
                const dateObj = new Date(timestamp);
                const dateStr = timestamp > 0 ? dateObj.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }) : '??.??';

                const timerElementId = `timer-${historyId}`;
                let rightContentHtml = '';
                let cardOpacity = '1';
                let overlayHtml = '';

                // Оверлей отмены
                const isCancelAcked = localStorage.getItem(`ack_cancel_${historyId}`);
                if (status === 'canceled' && !isCancelAcked) {
                    let titleText = "Трейд<br>отменен!";
                    let subText = "попробуйте вывести еще раз";
                    if (item.details && item.details.includes('||')) {
                        const parts = item.details.split('||');
                        titleText = parts[0]; subText = parts[1];
                    }
                    overlayHtml = `
                        <div class="inv-overlay" id="blur-overlay-${historyId}">
                            <div class="inv-overlay-title">${titleText}</div>
                            <div class="inv-overlay-sub">${subText}</div>
                            <button class="inv-overlay-btn" onclick="acknowledgeCancel(${historyId})">ХОРОШО</button>
                        </div>
                    `;
                }

                if (status === 'auto_queued') {
                    rightContentHtml = `<div style="color: #64d2ff; font-size: 9px; font-weight: 800; padding: 4px 0;">ПОИСК...</div>`;
                }
                else if (status === 'processing') {
                    rightContentHtml = `<div style="color: #ffd700; font-size: 9px; font-weight: 800; padding: 4px 0;">ОБРАБОТКА</div>`;
                }
                else if (status === 'market_pending') {
                    rightContentHtml = `
                        <div style="color: #bf5af2; font-size: 9px; font-weight: 800; text-transform: uppercase; margin-bottom: 2px;">
                            <i class="fa-solid fa-spinner fa-spin"></i> СБОРКА БОТОМ
                        </div>
                        <div style="font-size: 8px; color: rgba(255,255,255,0.6); margin-bottom: 4px;">Ждем отправку...</div>
                        <button id="check-btn-${historyId}" class="inv-btn" onclick="checkTradeStatus(${historyId})" style="background: rgba(255,255,255,0.1); color: #fff;">
                            <span id="check-icon-${historyId}"><i class="fa-solid fa-rotate"></i> Обновить</span>
                        </button>`;
                }
                else if (status === 'offer_sent' || status === 'sent') {
                    rightContentHtml = `
                        <div style="color: #ffd700; font-size: 9px; font-weight: 800; text-transform: uppercase; margin-bottom: 2px; animation: pulse-opacity 1.5s infinite;">
                            ПРИМИТЕ ОФФЕР
                        </div>
                        <div id="${timerElementId}" style="background: rgba(255,255,255,0.1); color: #fff; padding: 4px 2px; border-radius: 6px; font-size: 9px; font-family: monospace; margin-bottom: 4px;">--:--</div>
                        <div style="display: flex; gap: 4px; margin-top: 4px;">
                            <button class="inv-btn" onclick="window.open('https://steamcommunity.com/my/tradeoffers/', '_blank')" style="background: rgba(10, 132, 255, 0.8); color: #fff; flex: 1;">
                                <i class="fa-brands fa-steam"></i> Steam
                            </button>
                            <button id="check-btn-${historyId}" class="inv-btn" onclick="checkTradeStatus(${historyId})" style="background: rgba(255, 215, 0, 0.8); color: #000; flex: 1;">
                                <span id="check-icon-${historyId}"><i class="fa-solid fa-rotate"></i> Чек</span>
                            </button>
                        </div>`;
                    setTimeout(() => { if (typeof initCountdown === 'function') initCountdown(timerElementId, item.updated_at); }, 50);
                }
                else if (status === 'received') {
                    cardOpacity = '0.6';
                    rightContentHtml = `<div style="color: #32d74b; font-size: 10px; font-weight: 800;"><i class="fa-solid fa-check"></i> ПОЛУЧЕНО</div>`;
                } 
                else if (status === 'exchanged') {
                    cardOpacity = '0.6';
                    rightContentHtml = `<div style="color: #fff; font-size: 10px; font-weight: 800;">+${ticketVal} <i class="fa-solid fa-ticket" style="color:#ffd700;"></i></div>`;
                }
                else if (status === 'exchanged_swap') {
                    cardOpacity = '0.6';
                    rightContentHtml = `<div style="color: rgba(255,255,255,0.6); font-size: 10px; font-weight: 800;">СВАП</div>`;
                }
                else if (status === 'failed') {
                    cardOpacity = '0.8';
                    rightContentHtml = `
                        <div style="color: #ff453a; font-size: 9px; font-weight: 800; margin-bottom: 4px;">
                            <i class="fa-solid fa-triangle-exclamation"></i> ОШИБКА
                        </div>
                        <div style="font-size: 8px; color: rgba(255,255,255,0.6); line-height: 1.2;">Скин заморожен.</div>
                    `;
                }
                else {
                    // available, pending, canceled
                    const updateTimeMs = parseSafeDate(item.updated_at || item.created_at);
                    const source = item.source || 'shop';
                    const amnestyTimestamp = new Date('2026-07-15T00:00:00+03:00').getTime();
                    
                    let expireTimeMs = 0;
                    if (updateTimeMs < amnestyTimestamp) expireTimeMs = amnestyTimestamp + (14 * 24 * 60 * 60 * 1000);
                    else {
                        let daysToKeep = ['raffle', 'auction', 'twitch'].includes(source) ? 3 : 14;
                        expireTimeMs = updateTimeMs + (daysToKeep * 24 * 60 * 60 * 1000);
                    }
                    
                    let expirationHtml = '';
                    let isExpired = false;
                    
                    if (updateTimeMs > 0) {
                        const timeLeftMs = expireTimeMs - Date.now();
                        if (timeLeftMs > 0) {
                            const days = Math.floor(timeLeftMs / (1000 * 60 * 60 * 24));
                            const hours = Math.floor((timeLeftMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                            let timeStr = days > 0 ? `${days}д ${hours}ч` : `${hours}ч`;
                            if (days === 0 && hours === 0) timeStr = `${Math.floor((timeLeftMs % (1000 * 60 * 60)) / (1000 * 60))}м`;
                            
                            const textColor = days < 1 ? '#ff453a' : '#ff9f0a';
                            expirationHtml = `
                                <div style="color: ${textColor}; font-size: 8px; font-weight: 800; margin-bottom: 4px; text-transform: uppercase;">
                                    <i class="fa-solid fa-fire"></i> Сгорит: ${timeStr}
                                </div>`;
                        } else {
                            isExpired = true;
                            expirationHtml = `
                                <div style="color: #ff453a; font-size: 8px; font-weight: 800; margin-bottom: 4px; text-transform: uppercase;">
                                    <i class="fa-solid fa-skull"></i> ВРЕМЯ ВЫШЛО
                                </div>`;
                        }
                    }

                    const btnStyle = isExpired ? 'background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.3); cursor: not-allowed; border: none; box-shadow: none;' : '';
                    const withdrawAction = isExpired ? '' : `onclick="withdrawItem(${historyId}, '${displayName.replace(/'/g, "\\'")}')"`;
                    const sellAction = isExpired ? '' : `onclick="exchangeItem(${historyId}, ${ticketVal})"`;

                    rightContentHtml = `
                        ${expirationHtml}
                        <button id="withdraw-btn-${historyId}" class="inv-btn inv-btn-claim" style="${btnStyle}" ${withdrawAction} ${isExpired ? 'disabled' : ''}>
                            ЗАБРАТЬ
                        </button>
                        <button class="inv-btn inv-btn-sell" style="${btnStyle}" ${sellAction} ${isExpired ? 'disabled' : ''}>
                            ЗА ${ticketVal} 🎟️
                        </button>`;
                }

                const el = document.createElement('div');
                el.className = 'inv-card';
                el.style.opacity = cardOpacity;
                el.style.borderLeft = `3px solid ${rData.color}`; // Акцентная полоса слева
                el.style.setProperty('--rarity-color', rData.color); // Для фонового свечения
                
                const conditionText = (item.condition && !isReplaced && !isSwapped) ? item.condition : '';
                
                el.innerHTML = `
                    ${overlayHtml}
                    <div class="inv-card-top">
                        <span>#${historyId}</span>
                        <span style="color: rgba(255,255,255,0.4);">${conditionText}</span>
                        <span>${dateStr}</span>
                    </div>
                    <div class="inv-card-img-wrap">
                        ${imageContentHtml}
                    </div>
                    <div class="inv-card-price">${item.price_rub ? item.price_rub + ' ₽' : '??? ₽'}</div>
                    <div class="inv-card-name" style="color: ${rData.color};">${displayName}</div>
                    <div class="inv-card-status">
                        ${rightContentHtml}
                    </div>
                `;
                container.appendChild(el);
            });

            // Обновляем кнопку продать всё
            const sellAllBtn = document.getElementById('sell-all-btn');
            if (sellAllBtn) {
                if (availableSellCount > 0) {
                    sellAllBtn.style.display = 'block';
                    sellAllBtn.innerHTML = `<i class="fa-solid fa-tags"></i> Продать (${totalSellTickets.toFixed(2)} 🎟️)`;
                    sellAllBtn.dataset.amount = totalSellTickets.toFixed(2);
                    sellAllBtn.dataset.count = availableSellCount;
                } else {
                    sellAllBtn.style.display = 'none';
                }
            }
        }

        // --- УТИЛИТА ПОДТВЕРЖДЕНИЯ (CUSTOM CONFIRM) ---
        function showCustomConfirmHTML(text, onConfirmCallback, btnText = 'Да', btnColor = '#0a84ff') {
            const overlay = document.createElement('div'); 
            overlay.className = 'modal-overlay visible'; // Используем стили из модалок
            overlay.style.alignItems = 'center';
            
            const box = document.createElement('div'); 
            box.style.cssText = `background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border); border-radius: 24px; padding: 24px; width: 85%; max-width: 320px; text-align: center; color: white; box-shadow: var(--glass-shadow); transform: scale(0.95); animation: popIn 0.2s forwards;`;
            
            box.innerHTML = `
                <h3 style="margin: 0 0 20px; font-size: 18px; font-weight: 800; line-height: 1.4;">${text}</h3>
                <div style="display: flex; gap: 12px;">
                    <button id="custom-cancel-btn" style="flex: 1; padding: 12px; border: none; border-radius: 14px; background: rgba(255,255,255,0.1); color: white; font-size: 14px; font-weight: 700; cursor: pointer;">Отмена</button>
                    <button id="custom-confirm-btn" style="flex: 1; padding: 12px; border: none; border-radius: 14px; background: ${btnColor}; color: #fff; font-size: 14px; font-weight: 800; cursor: pointer; text-shadow: 0 1px 2px rgba(0,0,0,0.3);">${btnText}</button>
                </div>`;
                
            overlay.appendChild(box); 
            document.body.appendChild(overlay);
            
            const close = () => { overlay.style.opacity = '0'; setTimeout(() => overlay.remove(), 300); };
            overlay.querySelector('#custom-cancel-btn').onclick = close;
            
            const confirmBtn = overlay.querySelector('#custom-confirm-btn');
            confirmBtn.onclick = () => {
                if (confirmBtn.dataset.clicked) return;
                confirmBtn.dataset.clicked = "true";
                confirmBtn.style.transform = "scale(0.95)";
                onConfirmCallback(close);
            };
        }

        // --- ДЕЙСТВИЯ С ИНВЕНТАРЕМ ---
        window.acknowledgeCancel = function(historyId) {
            localStorage.setItem(`ack_cancel_${historyId}`, 'true');
            const overlay = document.getElementById(`blur-overlay-${historyId}`);
            if (overlay) overlay.style.display = 'none';
            if (typeof loadData === 'function') loadData(true);
        };

        window.withdrawItem = function(historyId, itemName) {
            if (isUpdating) return;
            const lockKey = `claim_lock_${historyId}`;
            const lockTimestamp = localStorage.getItem(lockKey);
            
            if (lockTimestamp && (Date.now() - lockTimestamp < 30 * 60 * 1000)) {
                tg.showAlert("⏳ Трейд уже в очереди! Steam может тупить, подождите еще немного.");
                return;
            }

            showCustomConfirmHTML(`Вывести "${itemName}" в Steam?`, async (closeConfirm) => {
                isUpdating = true;
                const btn = document.getElementById(`withdraw-btn-${historyId}`);
                const originalText = btn ? btn.innerHTML : "ЗАБРАТЬ";
                if (btn) { btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> ЖДЕМ...'; btn.style.opacity = '0.7'; }

                try {
                    const res = await apiRequest('/api/v1/user/inventory/withdraw', 'POST', { history_id: historyId });
                    closeConfirm();

                    if (res && res.status === 'offer_replacement') {
                        if (typeof openReplacementModal === 'function') openReplacementModal(historyId, res.options);
                    } else if (res && res.success) {
                        localStorage.setItem(lockKey, Date.now());
                        if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                        tg.showPopup({message: res.message});
                    }
                    // Обновляем данные на бэке. Заглушка для теста:
                    console.log('Данные обновлены после вывода');
                } catch (e) {
                    closeConfirm();
                    tg.showAlert("Ошибка: " + e.message);
                    if (btn) { btn.innerHTML = originalText; btn.style.opacity = '1'; }
                } finally {
                    isUpdating = false;
                }
            }, "ВЫВЕСТИ", "#34c759");
        }

        window.sellAllItems = function() {
            const btn = document.getElementById('sell-all-btn');
            const amount = btn.dataset.amount;
            const count = btn.dataset.count;
            
            showCustomConfirmHTML(`Продать ВСЕ доступные скины (${count} шт.) за ${amount} 🎟️?`, async (close) => {
                document.getElementById('global-loader').classList.add('active');
                try {
                    const res = await apiRequest('/api/v1/user/inventory/sell_all', 'POST');
                    tg.showAlert(res.message || `Успешно! +${amount} билетов.`);
                    if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    close();
                } catch (e) {
                    tg.showAlert(e.message || "Ошибка при массовой продаже");
                    close();
                } finally {
                    document.getElementById('global-loader').classList.remove('active');
                }
            }, "ПРОДАТЬ ВСЁ", "#ffd700");
        }

        window.exchangeItem = function(historyId, amount) {
            showCustomConfirmHTML(`Продать скин за ${amount} 🎟️?`, async (close) => {
                document.getElementById('global-loader').classList.add('active');
                try {
                    const res = await apiRequest('/api/v1/user/inventory/sell', 'POST', { history_id: historyId });
                    tg.showAlert(res.message || `Успешно! +${amount} билетов.`);
                    if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    close();
                } catch (e) {
                    tg.showAlert(e.message || "Ошибка обмена");
                    close();
                } finally {
                    document.getElementById('global-loader').classList.remove('active');
                }
            }, "ПРОДАТЬ", "#34c759");
        }

        window.checkTradeStatus = async function(historyId, isAuto = false) {
            const btn = document.getElementById(`check-btn-${historyId}`);
            if (btn && btn.style.opacity === '0.5') return; 

            const now = Date.now();
            if (checkCooldowns[historyId] && (now - checkCooldowns[historyId] < 55000)) { 
                if (!isAuto) tg.showPopup({message: "⏳ Проверять статус можно раз в минуту. Подождите немного."});
                return;
            }
            
            checkCooldowns[historyId] = now;
            const iconContainer = document.getElementById(`check-icon-${historyId}`);
            
            if (btn) btn.style.opacity = '0.5';
            if (iconContainer) iconContainer.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';

            try {
                const res = await apiRequest('/api/v1/user/inventory/check_trade', 'POST', { history_id: historyId });
                if (res && res.success) {
                    if (!isAuto) tg.showPopup({message: res.message});
                } else {
                    if (!isAuto) tg.showPopup({message: res.message || "Оффер еще не принят. Посмотрите в Steam."});
                }
                console.log('Статус обновлен');
            } catch (e) {
                if (!isAuto) tg.showAlert("Ошибка: " + e.message);
            } finally {
                if (iconContainer) iconContainer.innerHTML = '<i class="fa-solid fa-rotate"></i> Чек';
                if (btn) btn.style.opacity = '1';
            }
        }

        // --- ОКНО ЗАМЕНЫ (REPLACEMENT MODAL) ---
        window.openReplacementModal = function(historyId, options) {
            const modal = document.getElementById('replacement-modal');
            const container = document.getElementById('replacement-options-list');
            if(!modal || !container) return;
            
            container.innerHTML = options.map(item => {
                let r = (item.rarity || '').toLowerCase();
                let rClass = 'blue';
                if (r.includes('purple')) rClass = 'purple';
                else if (r.includes('pink')) rClass = 'pink';
                else if (r.includes('red')) rClass = 'red';
                else if (r.includes('gold')) rClass = 'gold';

                const nameParts = item.name_ru.split('|');
                const itemType = nameParts.length > 1 ? nameParts[0].trim() : '';
                const cleanName = nameParts.length > 1 ? nameParts.slice(1).join('|').trim() : item.name_ru.trim();
                const safeName = item.name_ru.replace(/'/g, "");

                const lowerType = itemType.toLowerCase();
                let sizeClass = (lowerType.includes('наклейка') || lowerType.includes('граффити') || lowerType.includes('нашивка') || lowerType.includes('значок')) ? 'is-small-item' : '';

                return `
                    <div class="replacement-card ${rClass} ${sizeClass}" onclick="initiateReplacementConfirm(${historyId}, '${item.assetid}', '${safeName}')">
                        <div class="replacement-img-wrapper"><img src="${item.icon_url}" loading="lazy"></div>
                        <div class="replacement-text-zone">
                            ${itemType ? `<div class="replacement-type">${itemType}</div>` : ''}
                            <div class="replacement-name">${cleanName}</div>
                            <div class="replacement-condition">${item.condition || '-'}</div>
                        </div>
                    </div>
                `;
            }).join('');

            modal.classList.add('visible');
        }

        window.closeReplacementModal = function() {
            const modal = document.getElementById('replacement-modal');
            if(modal) modal.classList.remove('visible');
        }

        window.initiateReplacementConfirm = function(historyId, assetid, itemName) {
            showCustomConfirmHTML(`Забрать "${itemName}"?`, async (closeConfirmWindow) => {
                if (isUpdating) return;
                isUpdating = true;     
                
                closeConfirmWindow(); 
                closeReplacementModal();
                document.getElementById('global-loader').classList.add('active');

                try {
                    const res = await apiRequest('/api/v1/user/inventory/confirm_replacement', 'POST', { history_id: historyId, assetid: assetid });
                    if (res && res.success) {
                        if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                        tg.showPopup({message: 'Замена успешно выбрана!'});
                    } else {
                        tg.showAlert("❌ " + (res.message || "Ошибка замены"));
                    }
                } catch (e) {
                    tg.showAlert("Ошибка: " + e.message);
                } finally {
                    document.getElementById('global-loader').classList.remove('active');
                    isUpdating = false; 
                }
            }, "ЗАБРАТЬ", "#ffd700"); 
        }

        // =========================================================
        // КОНЕЦ ЛОГИКИ ИНВЕНТАРЯ
        // =========================================================

    </script>
</body>

<!DOCTYPE html>
<html lang="ru">
<head>  
    <meta charset="UTF-8" />
    <title>Профиль | HATElavka SPA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <script src="/bottom-nav.js" defer></script>
    
    <style>
        :root {
            /* Единая элегантная палитра */
            --bg-color: #050505;
            --text-color: #ffffff;
            --text-color-muted: #8e8e93;
            
            /* Убираем светофор. Оставляем благородные цвета */
            --primary-color: #ffffff; 
            --action-color: rgba(255, 255, 255, 0.15);
            --danger-color: rgba(255, 69, 58, 0.9);
            
            /* iOS Liquid Glass Variables - Премиальное темное стекло */
            --glass-bg: rgba(18, 18, 20, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
            --glass-blur: blur(25px);
            
            /* БАЗОВЫЙ ОТСТУП ДЛЯ МОБИЛЬНЫХ УСТРОЙСТВ */
            --safe-top-gap: calc(env(safe-area-inset-top, 15px) + 40px);
        }

        /* --- АДАПТАЦИЯ ДЛЯ КОМПЬЮТЕРОВ (ПК) --- */
        @media (min-width: 768px) {
            :root {
                --safe-top-gap: 20px;
            }
            .profile-header {
                padding-bottom: 15px !important;
            }
            .nav-item {
                font-size: 11px !important;
                min-height: 40px !important;
            }
            .avatar-container {
                width: 90px !important;
                height: 90px !important;
            }
            .nickname {
                font-size: 22px !important;
            }
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Arial, sans-serif;
            overflow: hidden; 
            -webkit-tap-highlight-color: transparent;
        }

        .profile-skeleton {
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }

        /* ЕДИНЫЙ КОНТЕЙНЕР ДЛЯ ШАПКИ И НАВИГАЦИИ */
        .header-nav-wrapper {
            position: absolute; 
            top: 0;
            left: 0;
            width: 100%;
            box-sizing: border-box;
            background: linear-gradient(180deg, rgba(15,15,15,0.9) 0%, rgba(10,10,12,0.7) 100%);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow); 
            z-index: 1000;
            padding-top: var(--safe-top-gap);
        }

        /* --- HEADER --- */
        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px 5px 15px; 
            gap: 15px;
        }

        .avatar-container {
            width: 75px;
            height: 75px;
            border-radius: 22px; 
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            border: 1px solid var(--glass-border);
            flex-shrink: 0;
            background: #111;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1;
        }

        .user-icons {
            font-size: 16px;
            margin-bottom: 4px;
            display: flex;
            gap: 10px;
        }
        
        .user-icons i {
            cursor: pointer;
            transition: transform 0.2s, color 0.3s ease, text-shadow 0.3s ease;
        }
        
        .user-icons i:active { transform: scale(0.8); }

        .nickname {
            color: #ffffff;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(255,255,255,0.1);
        }

        .user-id {
            color: var(--text-color-muted);
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .settings-btn {
            background-color: rgba(255,255,255,0.05);
            color: #fff;
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 4px 12px;
            font-size: 10px;
            font-weight: 700;
            text-transform: lowercase;
            cursor: pointer;
            width: fit-content;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }
        .settings-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }

        .history-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .history-title {
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-color-muted);
        }

        .history-slots {
            display: flex;
            gap: 5px;
        }

        .h-slot {
            width: 32px;
            height: 32px;
            background-color: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* --- NAV BAR --- */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px 5px 10px;
        }

        .nav-item {
            flex: 1;
            text-align: center;
            font-size: 9px;
            font-weight: 800;
            color: rgba(255,255,255,0.3);
            padding: 8px 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            line-height: 1.1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 30px;
        }

        .nav-item.active {
            color: #ffffff;
            font-weight: 800;
            text-shadow: 0 0 15px rgba(255,255,255,0.4);
        }
        
        /* --- CONTENT AREA --- */
        #content-area {
            flex-grow: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 15px; 
            padding-top: calc(var(--safe-top-gap) + 175px); 
            position: relative;
            box-sizing: border-box;
            width: 100%;
            height: 100vh;
        }

        .tab-loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: var(--text-color-muted);
            font-size: 28px;
        }
        
        /* --- LIQUID GLASS MODAL (SETTINGS) --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            z-index: 10000; display: flex; align-items: flex-end; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.visible { opacity: 1; pointer-events: auto; }
        
        .bottom-sheet {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-top: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            width: 100%; border-radius: 28px 28px 0 0;
            padding: 24px 20px 40px 20px;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .modal-overlay.visible .bottom-sheet { transform: translateY(0); }

        .sheet-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px;
        }
        .sheet-title { font-size: 20px; font-weight: 800; margin: 0; color: #fff; }
        .sheet-close {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: #fff;
            width: 32px; height: 32px; border-radius: 16px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .sheet-close:active { transform: scale(0.9); }

        /* Карточки внутри настроек */
        .settings-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            border-radius: 16px; padding: 16px;
            margin-bottom: 15px; display: flex; flex-direction: column; gap: 12px;
        }
        .settings-card-row { display: flex; justify-content: space-between; align-items: center; }
        
        .settings-icon-title { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; color: #fff; }
        .settings-status-text { font-size: 13px; color: var(--text-color-muted); word-break: break-all; }
        
        .ios-input {
            width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border);
            color: #fff; padding: 12px 15px; border-radius: 12px; font-size: 13px; outline: none;
            box-sizing: border-box; transition: 0.3s;
        }
        .ios-input:focus { border-color: rgba(255,255,255,0.3); background: rgba(0,0,0,0.7); }
        .ios-input.error { border-color: var(--danger-color); box-shadow: 0 0 10px rgba(255,69,58,0.2); }

        .ios-btn {
            border: 1px solid var(--glass-border); padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 700;
            cursor: pointer; transition: all 0.2s; color: #fff; backdrop-filter: blur(5px);
        }
        .ios-btn:active { transform: scale(0.95); }
        /* Единый стиль кнопок в настройках */
        .btn-twitch, .btn-steam { background: rgba(255,255,255,0.05); }
        .btn-danger { background: rgba(255,69,58,0.1); color: #ff453a; border-color: rgba(255,69,58,0.2); }

        /* Loader Overlay (Global) */
        #global-loader {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            z-index: 99999; display: none; align-items: center; justify-content: center;
        }
        #global-loader.active { display: flex; }

        /* Fullscreen Weapon Modal */
        #fullscreen-weapon-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 999999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; backdrop-filter: blur(20px);
        }
        #fullscreen-weapon-modal.visible { opacity: 1; pointer-events: auto; }
        #fullscreen-weapon-img { max-width: 90%; max-height: 60%; object-fit: contain; filter: drop-shadow(0 10px 40px rgba(255,255,255,0.1)); transform: scale(1.15); }
        #fullscreen-weapon-name { color: #fff; font-size: 18px; font-weight: 800; margin-top: 20px; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,0.8); text-align: center; padding: 0 20px; }
        #fullscreen-weapon-close { position: absolute; top: max(env(safe-area-inset-top, 24px) + 50px, 80px); right: 20px; left: auto; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }

        /* Кнопка скролла наверх */
        #scroll-to-top {
            position: absolute; bottom: 20px; right: 20px; width: 38px; height: 38px;
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center;
            font-size: 14px; cursor: pointer; z-index: 100; opacity: 0; pointer-events: none;
            backdrop-filter: blur(15px); transition: 0.3s box-shadow, 0.3s opacity;
            box-shadow: var(--glass-shadow);
        }

        /* Дополнительные анимации из старого дизайна */
        @keyframes pulse-opacity {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        .fa-spin-fast {
            animation: fa-spin 0.8s linear infinite;
        }
        /* --- КРЕАТИВНЫЙ ЛОАДЕР ДЛЯ ВЫВОДА В STEAM --- */
        .withdraw-loader-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 999999; display: flex; flex-direction: column;
            align-items: center; justify-content: center; opacity: 0;
            pointer-events: none; transition: opacity 0.3s ease;
        }
        .withdraw-loader-overlay.active {
            opacity: 1; pointer-events: auto;
        }
        .withdraw-loader-icon {
            font-size: 50px; color: #ffffff;
            margin-bottom: 20px; filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3));
            animation: pulse-spin 2s infinite ease-in-out;
        }
        .withdraw-loader-title {
            color: rgba(255,255,255,0.4); font-size: 11px; font-weight: 800; 
            text-transform: uppercase; margin-bottom: 5px;
        }
        .withdraw-loader-item {
            color: #ffffff; font-size: 16px; font-weight: 900; 
            text-align: center; margin-bottom: 20px; max-width: 80%;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }
        .withdraw-loader-msg {
            color: var(--text-color-muted); font-size: 14px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 1px; text-align: center; transition: opacity 0.3s ease;
        }
        @keyframes pulse-spin {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }
        
        /* Анимация поп-апов */
        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="global-loader"><i class="fa-solid fa-circle-notch fa-spin" style="font-size: 40px; color: #fff;"></i></div>

    <!-- Модалка просмотра оружия на весь экран -->
    <div id="fullscreen-weapon-modal">
        <button id="fullscreen-weapon-close" onclick="closeFullscreenWeapon()"><i class="fa-solid fa-xmark"></i></button>
        <img id="fullscreen-weapon-img" src="" alt="Weapon">
        <div id="fullscreen-weapon-name"></div>
    </div>

    <div class="profile-skeleton">
        
        <!-- ЕДИНЫЙ БЛОК ШАПКИ И МЕНЮ В ЖИДКОМ СТЕКЛЕ -->
        <div class="header-nav-wrapper">
            <!-- HEADER -->
            <header class="profile-header">
                <div style="display: flex; gap: 15px;">
                    <div class="avatar-container">
                        <img id="user-avatar" src="https://placehold.co/150x150/1c1c1e/ffffff?text=..." alt="Avatar">
                    </div>
                    
                    <div class="user-info">
                        <div class="user-icons">
                            <i id="icon-steam" class="fa-brands fa-steam" style="color: rgba(255,255,255,0.2);" onclick="openSettings()"></i>
                            <i id="icon-twitch" class="fa-brands fa-twitch" style="color: rgba(255,255,255,0.2);" onclick="openSettings()"></i>
                        </div>
                        <div class="nickname" id="user-nickname">Загрузка...</div>
                        <div class="user-id" id="user-id">ID -----</div>
                        <button class="settings-btn" onclick="openSettings()">настройки</button>
                    </div>
                </div>

                <!-- ИСТОРИЯ СПРАВА -->
                <div class="history-block">
                    <div class="history-title">ИСТОРИЯ</div>
                    <div class="history-slots">
                        <div class="h-slot"></div>
                        <div class="h-slot"></div>
                        <div class="h-slot"></div>
                    </div>
                </div>
            </header>

            <!-- NAV -->
            <nav class="nav-bar">
                <div class="nav-item active" data-target="inventory">ИНВЕНТАРЬ</div>
                <div class="nav-item" data-target="events">СОБЫТИЯ</div>
                <div class="nav-item" data-target="promocodes">ПРОМОКОДЫ</div>
                <div class="nav-item" data-target="referral">РЕФЕРАЛЬНЫЙ<br>КАБИНЕТ</div>
            </nav>
        </div>

        <!-- DYNAMIC CONTENT AREA -->
        <main id="content-area">
        </main>

        <!-- Кнопка скролла наверх -->
        <div id="scroll-to-top" onclick="document.getElementById('content-area').scrollTo({top:0, behavior:'smooth'})">
            <i class="fa-solid fa-chevron-up"></i>
        </div>
    </div>

    <!-- LIQUID GLASS SETTINGS MODAL -->
    <div id="settings-modal" class="modal-overlay" onclick="if(event.target===this) closeSettings()">
        <div class="bottom-sheet">
            <div class="sheet-header">
                <h3 class="sheet-title">Настройки аккаунта</h3>
                <button class="sheet-close" onclick="closeSettings()"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Блок Сетки Инвентаря -->
            <div class="settings-card">
                <div class="settings-card-row">
                    <div class="settings-icon-title">
                        <i class="fa-solid fa-table-cells" style="color: rgba(255,255,255,0.6); font-size: 20px;"></i>
                        Сетка инвентаря
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button class="ios-btn" id="grid-size-2" onclick="setGridSize(2)" style="background: rgba(255,255,255,0.05); color: #fff;">2 в ряд</button>
                        <button class="ios-btn" id="grid-size-3" onclick="setGridSize(3)" style="background: rgba(255,255,255,0.05); color: #fff;">3 в ряд</button>
                    </div>
                </div>
            </div>

            <!-- Блок Twitch -->
            <div class="settings-card">
                <div class="settings-card-row">
                    <div class="settings-icon-title">
                        <i class="fa-brands fa-twitch" style="color: rgba(255,255,255,0.6); font-size: 20px;"></i>
                        Twitch Аккаунт
                    </div>
                </div>
                <div class="settings-card-row">
                    <div class="settings-status-text" id="twitch-status-text">Загрузка...</div>
                    <div id="twitch-action-btn-container">
                        <!-- Кнопка генерируется в JS -->
                    </div>
                </div>
            </div>

            <!-- Блок Steam Trade Link -->
            <div class="settings-card">
                <div class="settings-card-row" style="margin-bottom: 5px;">
                    <div class="settings-icon-title">
                        <i class="fa-brands fa-steam" style="color: rgba(255,255,255,0.6); font-size: 20px;"></i>
                        Trade Ссылка
                    </div>
                </div>
                <div>
                    <input type="url" id="trade-link-input" class="ios-input" placeholder="https://steamcommunity.com/tradeoffer/new/..." autocomplete="off">
                </div>
                <div style="display: flex; justify-content: flex-end; margin-top: 5px;">
                    <button class="ios-btn btn-steam" onclick="saveTradeLink()">Сохранить ссылку</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ОКНО ЗАМЕН (Остается на уровне DOM, стилизовано под новое стекло) -->
    <div id="replacement-modal" class="modal-overlay">
        <div class="custom-popup" style="background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border); border-radius: 24px; padding: 24px; max-width: 360px; width: 90%; margin: auto; position: relative; display: flex; flex-direction: column; box-shadow: var(--glass-shadow);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h3 style="margin: 0; font-size: 18px; color: #fff; font-weight: 800;">Выберите замену</h3>
                <button onclick="closeReplacementModal()" style="background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: #fff; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <p style="font-size: 11px; color: var(--text-color-muted); margin: 0 0 10px 0; text-align: left;">Оригинала нет, выберите любой скин — отправим его сразу:</p>
            
            <div id="replacement-options-list" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; max-height: 60vh; overflow-y: auto; padding-bottom: 10px;">
                <!-- Динамически заполняется -->
            </div>

            <button onclick="closeReplacementModal()" class="ios-btn" style="background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); margin-top: 10px; width: 100%; color: #fff;">Отмена</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let currentUserData = null; 
        let isUpdating = false; 
        const checkCooldowns = {};
        window.currentInventoryItems = [];
        
        // Логика настройки сетки инвентаря (2 или 3)
        let currentGridSize = localStorage.getItem('inventory_grid_size') || '3';
        function setGridSize(size) {
            currentGridSize = size.toString();
            localStorage.setItem('inventory_grid_size', currentGridSize);
            updateGridButtons();
            if(window.currentInventoryItems && window.currentInventoryItems.length > 0) {
                renderInventory(window.currentInventoryItems, true);
            }
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }
        function updateGridButtons() {
            const b2 = document.getElementById('grid-size-2');
            const b3 = document.getElementById('grid-size-3');
            if(b2) b2.style.background = currentGridSize === '2' ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.05)';
            if(b3) b3.style.background = currentGridSize === '3' ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.05)';
        }
        updateGridButtons(); 

        // Слушатель скролла для кнопки наверх
        const contentAreaNode = document.getElementById('content-area');
        const scrollBtn = document.getElementById('scroll-to-top');
        if (contentAreaNode && scrollBtn) {
            contentAreaNode.addEventListener('scroll', () => {
                if (contentAreaNode.scrollTop > 150) {
                    scrollBtn.style.opacity = '1';
                    scrollBtn.style.pointerEvents = 'auto';
                } else {
                    scrollBtn.style.opacity = '0';
                    scrollBtn.style.pointerEvents = 'none';
                }
            });
        }

        // --- УНИВЕРСАЛЬНЫЕ ОКНА АЛЕРТОВ И ПОДТВЕРЖДЕНИЙ В НОВОМ СТИЛЕ ---
        window.customAlert = function(text, btnText = 'Закрыть', callback = null) {
            const overlay = document.createElement('div');

        // --- УТИЛИТА ДЛЯ API С ПОДДЕРЖКОЙ ЗАЩИТ ---
        async function apiRequest(endpoint, method = 'POST', body = null, isSilent = false) {
            if (!isSilent) document.getElementById('global-loader').classList.add('active');
            let url = endpoint;
            const options = { method, headers: { 'Content-Type': 'application/json' } };
            
            if (method === 'GET') {
                url += (url.includes('?') ? '&' : '?') + `initData=${encodeURIComponent(tg.initData)}`;
            } else {
                const b = body || {};
                b.initData = tg.initData;
                options.body = JSON.stringify(b);
            }
            
            try {
                const res = await fetch(url, options);
                if (res.status === 204) return null;
                const data = await res.json();
                
                if (!res.ok) {
                    if (data.detail && typeof data.detail === 'object' && data.detail.error_code === "ACTIVITY_LOCK") {
                        if(typeof window.showActivityWallModal === 'function') {
                            window.showActivityWallModal(data.detail.current_msgs, data.detail.required_msgs);
                        }
                        throw new Error("Activity Lock");
                    }
                    if (res.status === 403 && data.detail === "BANNED") {
                        document.body.innerHTML = `
                            <div style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 2147483647; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-align: center; padding: 30px; box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif;">
                                <i class="fa-solid fa-skull-crossbones" style="font-size: 100px; margin-bottom: 25px; filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.2));"></i>
                                <h1 style="font-size: 28px; font-weight: 900; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;">Доступ ограничен</h1>
                                <p style="color: var(--text-color-muted); font-size: 16px; line-height: 1.5; margin-bottom: 30px; max-width: 300px;">Твой аккаунт заблокирован за нарушение правил системы.</p>
                                <a href="https://t.me/hatelove_twitch" target="_blank" style="display: inline-flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border); color: #fff; text-decoration: none; padding: 14px 24px; border-radius: 14px; font-weight: 800; font-size: 14px; transition: transform 0.2s;">
                                    <i class="fa-brands fa-telegram" style="font-size: 18px;"></i> СВЯЗАТЬСЯ СО МНОЙ
                                </a>
                            </div>`;
                        document.body.style.overflow = 'hidden';
                        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                        throw new Error("USER_BANNED");
                    }
                    if (res.status === 400 && data.detail === "DUPLICATE_TRADE_LINK") {
                        if(typeof window.showSecurityBlock === 'function') window.showSecurityBlock("Эта Трейд-ссылка уже используется другим игроком! Мы удалили её. Укажите свою.");
                        throw new Error("Security Block");
                    }
                    if (res.status === 403) {
                        if(typeof window.showSecurityBlock === 'function') window.showSecurityBlock(data.detail || "Доступ ограничен.");
                        throw new Error("Security Block");
                    }
                    throw new Error(data.detail || 'Ошибка сервера');
                }
                return data;
            } catch (e) {
                if (e.message !== 'Security Block' && e.message !== 'USER_BANNED' && e.message !== 'Activity Lock' && !isSilent) {
                    customAlert(`Ошибка: ${e.message}`);
                }
                throw e;
            } finally {
                if (!isSilent) document.getElementById('global-loader').classList.remove('active');
            }
        }

        function getRarityData(rarity) {
            const r = (rarity || '').toLowerCase();
            if (r.includes('gold') || r.includes('крайне') || r.includes('knife')) return { color: '#ffd700', name: 'Крайне редкий' };
            if (r.includes('contraband') || r.includes('контрабандное')) return { color: '#e4ae39', name: 'Контрабандное' };
            if (r.includes('red') || r.includes('covert') || r.includes('ancient') || r.includes('тайное')) return { color: '#eb4b4b', name: 'Тайное' };
            if (r.includes('pink') || r.includes('classified') || r.includes('legendary') || r.includes('засекреченное')) return { color: '#d32ce6', name: 'Засекреченное' };
            if (r.includes('purple') || r.includes('restricted') || r.includes('mythical') || r.includes('запрещенное')) return { color: '#8847ff', name: 'Запрещённое' };
            if (r.includes('industrial') || r.includes('light_blue') || r.includes('промышленное')) return { color: '#5e98d9', name: 'Промышленное качество' };
            if (r.includes('blue') || r.includes('mil-spec') || r.includes('rare') || r.includes('армейское')) return { color: '#4b69ff', name: 'Армейское качество' };
            return { color: '#b0c3d9', name: 'Ширпотреб' };
        }

        function hexToRgba(hex, alpha) {
            let r = 0, g = 0, b = 0;
            hex = hex.replace('#', '');
            if (hex.length === 3) { r = parseInt(hex[0]+hex[0], 16); g = parseInt(hex[1]+hex[1], 16); b = parseInt(hex[2]+hex[2], 16); }
            else if (hex.length === 6) { r = parseInt(hex.substring(0,2), 16); g = parseInt(hex.substring(2,4), 16); b = parseInt(hex.substring(4,6), 16); }
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function parseSafeDate(dateStr) {
            if (!dateStr) return 0;
            if (typeof dateStr === 'number') return dateStr;
            let ms = new Date(dateStr).getTime();
            if (!isNaN(ms)) return ms;
            try {
                let cleanPart = String(dateStr).split('.')[0].split('+')[0];
                let safe = cleanPart.replace(' ', 'T');
                ms = new Date(safe).getTime();
                return isNaN(ms) ? 0 : ms;
            } catch(e) { return 0; }
        }

        function initCountdown(elementId, updatedAtStr) {
            const historyId = elementId.replace('timer-', '');
            const timerEl = document.getElementById(elementId);
            const wrapperEl = document.getElementById(`timer-wrapper-${historyId}`);
            const actionBtn = document.getElementById(`bottom-btn-${historyId}`);

            if (!timerEl || !wrapperEl) return;

            let dateStr = updatedAtStr.replace(' ', 'T');
            if (!dateStr.endsWith('Z') && !dateStr.includes('+')) dateStr += 'Z';
            
            const updateTime = new Date(dateStr).getTime();
            if (isNaN(updateTime)) { wrapperEl.innerHTML = "ОБРАБОТКА"; return; }
            
            const expireTime = updateTime + (4 * 60 * 1000); // 4 минуты на принятие
            const getDistance = () => expireTime - new Date().getTime();

            // Функция заморозки карточки
            const setCheckingState = () => {
                wrapperEl.innerHTML = `<i class="fa-solid fa-spinner fa-spin-fast"></i> ПРОВЕРКА...`;
                if (actionBtn) {
                    actionBtn.onclick = null; // Отключаем открытие меню
                    actionBtn.style.background = 'rgba(255,255,255,0.05)';
                    actionBtn.style.animation = 'none'; // Убираем мигание
                }
                const panel = document.getElementById(`action-panel-${historyId}`);
                if (panel) panel.style.display = 'none'; // Жестко прячем меню, если было открыто
            };

            if (getDistance() < 0) {
                setCheckingState();
                if (timerEl.dataset.intervalId) clearInterval(timerEl.dataset.intervalId);
                return;
            }

            const updateTimer = () => {
                const distance = getDistance();
                if (distance < 0) {
                    setCheckingState();
                    clearInterval(timerEl.dataset.intervalId);
                    checkTradeStatus(historyId, true); // Делаем контрольный чек
                    return;
                }
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                timerEl.innerHTML = `${minutes}:${seconds < 10 ? '0' + seconds : seconds}`;
            };

            if (timerEl.dataset.intervalId) clearInterval(timerEl.dataset.intervalId);
            updateTimer();
            timerEl.dataset.intervalId = setInterval(updateTimer, 1000);
        }

            if (!isSorting) window.currentInventoryItems = items || [];
            const itemsToRender = [...window.currentInventoryItems];

            // Динамические переменные шрифтов в зависимости от Сетки
            let fsAction = currentGridSize === '2' ? '12px' : '8px';
            let fsChevron = currentGridSize === '2' ? '10px' : '7px';
            let fsTitle = currentGridSize === '2' ? '11px' : '8.5px';
            let fsPrice = currentGridSize === '2' ? '12px' : '9px';
            let fsBtn = currentGridSize === '2' ? '11px' : '8px';
            let fsOverlay = currentGridSize === '2' ? '13px' : '10px';
            let fsExp = currentGridSize === '2' ? '10px' : '7px';
            let supportSize = currentGridSize === '2' ? '24px' : '18px';
            let supportFont = currentGridSize === '2' ? '14px' : '10px';
            let closeBtnSize = currentGridSize === '2' ? '26px' : '20px';
            let closeBtnIcon = currentGridSize === '2' ? '12px' : '8px';
            let nameDisplayStyle = currentGridSize === '2' ? 'display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; white-space: normal;' : 'white-space: nowrap;';
            let namePadding = currentGridSize === '2' ? '8px' : '24px';

            container.style.display = 'grid';
            container.style.gridTemplateColumns = `repeat(${currentGridSize}, 1fr)`;
            container.style.gap = '8px';
            container.style.width = '100%';
            
            const sortSelect = document.getElementById('inventory-sort-select');
            if (sortSelect && !sortSelect.dataset.minified) {
                sortSelect.innerHTML = `
                    <option value="date_desc">Сначала новые</option>
                    <option value="date_asc">Сначала старые</option>
                    <option value="price_desc">Сначала дорогие</option>
                    <option value="price_asc">Сначала дешевые</option>
                    <option value="status">По статусу</option>

                sortSelect.style.padding = '2px 6px';
                sortSelect.style.height = '24px';
                sortSelect.style.maxWidth = '115px';
                sortSelect.dataset.minified = 'true';
                sortSelect.style.background = 'rgba(255,255,255,0.05)';
                sortSelect.style.border = '1px solid var(--glass-border)';
                sortSelect.style.color = '#fff';
            }
            if (sortSelect) {
                sortSelect.style.transition = 'opacity 0.3s ease';
                sortSelect.style.opacity = itemsToRender.length > 0 ? '1' : '0';
            }

            container.innerHTML = '';

            let availableSellCount = 0;
            let totalSellTickets = 0.0;

            if (itemsToRender.length === 0) {
                container.style.display = 'block';
                container.innerHTML = `
                    <div style="text-align:center; padding-top: 50px;">
                        <i class="fa-solid fa-box-open" style="font-size: 40px; margin-bottom: 15px; opacity: 0.2; color: #fff;"></i>

                    </div>`;
                return;
            }

            const sortType = sortSelect ? sortSelect.value : 'date_desc';
            const statusWeight = { 
                'auto_queued': 1, 'market_pending': 2, 'sent': 3, 'offer_sent': 4, 'pending': 5,
                'available': 6, 'processing': 7, 'failed': 8, 'canceled': 9,
                'received': 10, 'exchanged': 11, 'exchanged_swap': 12
            };

            itemsToRender.sort((a, b) => {
               const dateA = parseSafeDate(a.created_at || a.updated_at || a.date);
               const dateB = parseSafeDate(b.created_at || b.updated_at || b.date);
               const priceA = parseFloat(a.price_rub || a.price || 0);
               const priceB = parseFloat(b.price_rub || b.price || 0);
               const statA = (a.status || 'available').toLowerCase();
               const statB = (b.status || 'available').toLowerCase();
               const weightA = statusWeight[statA] || 99;
               const weightB = statusWeight[statB] || 99;

                if (sortType === 'status') {
                    if (weightA !== weightB) return weightA - weightB;
                    return dateB - dateA; 
                }
                const isAArchived = weightA >= 10;
                const isBArchived = weightB >= 10;
                if (isAArchived && !isBArchived) return 1;
                if (!isAArchived && isBArchived) return -1;

                if (sortType === 'date_desc') return dateB - dateA;
                if (sortType === 'date_asc') return dateA - dateB;
                if (sortType === 'price_desc') return priceB - priceA;
                if (sortType === 'price_asc') return priceA - priceB;
                return dateB - dateA;
            });

            itemsToRender.forEach(item => {
                const status = (item.status || 'available').toLowerCase();
                const historyId = item.id || item.history_id; 

                if (['available', 'pending', 'failed', 'canceled', 'received'].includes(status)) {
                    localStorage.removeItem(`claim_lock_${historyId}`);
                }

                const rData = getRarityData(item.rarity); 
                const isSwapped = item.is_swapped === true;
                const isReplaced = !!item.replaced_name && !isSwapped; 
                
                let displayName = (isReplaced || isSwapped) ? item.replaced_name : item.name;
                if (!displayName && item.details && item.details.includes('Выигрыш:')) {
                    displayName = item.details.replace('Выигрыш:', '').split('||')[0].trim();

                let cleanName = displayName;
                if (displayName.includes('|')) cleanName = displayName.split('|').slice(1).join('|').trim();
                
                let imageUrl = item.image_url;
                if (!imageUrl || imageUrl.includes('null')) imageUrl = 'https://placehold.co/100x100/18181b/3f3f46?text=?';
                
                let strPrice = String(item.price_rub || item.price || "0").replace(',', '.');
                let strReplaced = String(item.replaced_price || "0").replace(',', '.');
                let parsedBasePrice = parseFloat(strPrice) || 0;
                let parsedReplPrice = parseFloat(strReplaced) || 0;
                const rawPrice = (isReplaced || isSwapped) && parsedReplPrice > 0 ? parsedReplPrice : parsedBasePrice;
                const ticketVal = parseFloat((rawPrice * 0.5).toFixed(2));
                const safeNameStr = displayName.replace(/'/g, "\\'");

                if (['available', 'pending', 'failed', 'canceled'].includes(status)) {
                    availableSellCount++;
                    totalSellTickets += ticketVal;
                }

                // Единый стиль карточки (Стекло)

                let centerOverlay = '';
                let overlayHtml = '';
                
                // Умное Блюр-уведомление для отмен и системных ошибок
                const isCancelAcked = localStorage.getItem(`ack_cancel_${historyId}`);
                
                // 🔥 ФИКС ОШИБОК: Жестко ограничиваем ошибки статусами, где сделка НЕ в процессе и НЕ завершена.
                const isErrorStatus = ['failed', 'canceled', 'available'].includes(status);
                const hasCustomError = isErrorStatus && item.details && item.details.includes('||');
                
                const shouldShowOverlay = (status === 'canceled' || status === 'failed' || (status === 'available' && hasCustomError)) && !isCancelAcked;

                if (shouldShowOverlay) {
                    let titleText = "Трейд<br>отменен!";

                        subText = parts[1];

                        <div class="inv-overlay" id="blur-overlay-${historyId}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 10, 12, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; border-radius: 12px; padding: 10px; box-sizing: border-box; text-align: center; border: 1px solid rgba(255,255,255,0.1);">
                            <div style="color: ${titleColor}; font-size: 12px; font-weight: 900; text-transform: uppercase; line-height: 1.2; margin-bottom: 6px; text-shadow: 0 2px 10px rgba(0,0,0,0.8);">${titleText}</div>
                            <div style="color: rgba(255,255,255,0.7); font-size: 9px; margin-bottom: 12px; line-height: 1.3; text-shadow: 0 1px 5px rgba(0,0,0,0.8);">${subText}</div>
                            <button style="background: var(--glass-bg); border: 1px solid var(--glass-border); box-shadow: 0 4px 15px rgba(0,0,0,0.5); color: #fff; border-radius: 8px; font-size: 10px; font-weight: 800; padding: 8px 20px; cursor: pointer; backdrop-filter: blur(5px); transition: 0.2s;" onclick="acknowledgeCancel(${historyId}, event)">Понятно</button>
                        </div>
                    `;
                }

                const nameCheck = displayName.toLowerCase();
                const isSmallItem = nameCheck.includes('music kit') || nameCheck.includes('музык') || nameCheck.includes('наклейка') || nameCheck.includes('агент') || nameCheck.includes('нашивка') || nameCheck.includes('значок') || nameCheck.includes('граффити');

                let imgTransform = currentGridSize === '2' ? 'scale(1.2) translateX(10%) translateY(0%)' : 'scale(1.3) translateX(15%) translateY(0%)';

                if (isArchived) {
                    imageStyles += ` opacity: 0.15; filter: blur(2px) grayscale(100%); transform: scale(1);`;
                    const lowerSkinName = `<div style="position:absolute; bottom: 8px; left: 0; width: 100%; text-align: center; font-size: ${fsTitle}; font-weight: 800; color: rgba(255,255,255,0.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; box-sizing: border-box; z-index: 6;">${cleanName}</div>`;

                    if (status === 'received') {
                        cardBgColor = 'rgba(255, 255, 255, 0.05)';
                        centerOverlay = `<div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:${fsOverlay}; font-weight:900; color:#b0b0b0; text-shadow:0 2px 5px rgba(0,0,0,0.8); text-transform:uppercase; text-align:center; z-index:5; transform: translateY(-10px);">Выведен</div>` + lowerSkinName;

                } 
                else if (status === 'auto_queued' || status === 'market_pending') {
                    imageStyles += ` opacity: 0.5; filter: grayscale(50%); transform: scale(1);`;
                }

                // Сгорание
                let expirationHtml = '';
                let isExpired = false;
                const updateTimeMs = parseSafeDate(item.updated_at || item.created_at);

                if (['available', 'pending', 'canceled'].includes(status)) {
                    const source = item.source || 'shop';
                    const amnestyTimestamp = new Date('2026-07-15T00:00:00+03:00').getTime();
                    let expireTimeMs = updateTimeMs < amnestyTimestamp 
                        ? amnestyTimestamp + (14 * 24 * 60 * 60 * 1000) 
                        : updateTimeMs + ((['raffle', 'auction', 'twitch'].includes(source) ? 3 : 14) * 24 * 60 * 60 * 1000);
                    
                    if (updateTimeMs > 0) {
                        const timeLeftMs = expireTimeMs - Date.now();
                        if (timeLeftMs > 0) {
                            const days = Math.floor(timeLeftMs / (1000 * 60 * 60 * 24));
                            const hours = Math.floor((timeLeftMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                            const minutes = Math.floor((timeLeftMs % (1000 * 60 * 60)) / (1000 * 60));
                            let timeStr = days > 0 ? `${days}д ${hours}ч ${minutes}м` : `${hours}ч ${minutes}м`;
                            if (days === 0 && hours === 0) timeStr = `${minutes}м`;
                            expirationHtml = `<span style="color: rgba(255,255,255,0.5);">Сгорит:</span> <span style="color: #ff3b30; font-weight: 900;">${timeStr}</span>`;
                        } else {
                            isExpired = true;
                            expirationHtml = `<span style="color: #ff3b30; font-weight: 900;">СГОРЕЛ</span>`;

                let bottomBtnText = '';
                let bottomBtnAction = '';
                let panelContent = '';
                let bottomBtnStyle = '';

                if (isArchived) {
                    bottomBtnText = ''; 
                } else if (isExpired && ['available', 'pending', 'canceled'].includes(status)) {
                    bottomBtnText = 'СГОРЕЛ';
                    bottomBtnStyle = 'background: rgba(255,255,255,0.02); color: var(--text-color-muted); border-top: 1px solid var(--glass-border);';

                    bottomBtnText = `<span id="check-icon-${historyId}" style="display:flex; align-items:center; gap:4px;"><i class="fa-solid fa-spinner fa-spin-fast"></i> СБОРКА БОТОМ</span>`;
                    bottomBtnAction = `onclick="checkTradeStatus(${historyId})"`;
                    bottomBtnStyle = 'background: rgba(255,255,255,0.05); color: #fff; border-top: 1px solid var(--glass-border);';
                } else if (status === 'processing') {
                    bottomBtnText = 'ОБРАБОТКА';
                    bottomBtnStyle = 'background: rgba(255,255,255,0.05); color: #fff; border-top: 1px solid var(--glass-border);';
                } else if (status === 'auto_queued') {
                    bottomBtnText = '<i class="fa-solid fa-magnifying-glass"></i> ПОИСК...';
                    bottomBtnStyle = 'background: rgba(255,255,255,0.05); color: #fff; border-top: 1px solid var(--glass-border);';
                } else if (status === 'offer_sent' || status === 'sent') {
                    const timerElementId = `timer-${historyId}`;
                    // Обернули весь текст в id="timer-wrapper-..."
                    bottomBtnText = `<span id="timer-wrapper-${historyId}">ЗАБРАТЬ <span id="${timerElementId}" style="margin-left:3px; color:#ffd700;">--:--</span></span> <i class="fa-solid fa-chevron-up" style="font-size:${fsChevron}; margin-left:2px;"></i>`;
                    bottomBtnStyle = 'background: rgba(255,255,255,0.1); color: #fff; border-top: 1px solid var(--glass-border); animation: pulse-opacity 1.5s infinite;';
                    // Добавили ID для самой кнопки, чтобы её блокировать
                    bottomBtnAction = `id="bottom-btn-${historyId}" onclick="toggleActionPanel('${historyId}', true, event)"`;
                    
                    // Убрали кнопку ОБНОВИТЬ СТАТУС, оставили только STEAM
                    panelContent = `
                        <div style="font-size: ${currentGridSize === '3' ? '7.5px' : '9px'}; color: #fff; font-weight: 800; margin-bottom: 4px; text-align: center; opacity: 0.8; line-height: 1.1;">ПРИМИТЕ ОФФЕР<br>В STEAM</div>
                        <button onclick="window.open('https://steamcommunity.com/my/tradeoffers/', '_blank'); toggleActionPanel('${historyId}', false, event);" style="box-sizing:border-box; background:rgba(42, 71, 94, 0.7); border:1px solid rgba(102, 192, 244, 0.4); color:#fff; border-radius:6px; font-size:${fsBtn}; font-weight:800; padding:4px; width:100%; margin-bottom:4px; line-height:1.3; transition:0.2s; backdrop-filter:blur(5px); box-shadow: 0 4px 15px rgba(27, 40, 56, 0.5);">
                            ОТКРЫТЬ<br>STEAM
                        </button>
                    `;
                    setTimeout(() => { if (typeof initCountdown === 'function') initCountdown(timerElementId, item.updated_at); }, 50);
                } else {
                    // Available, Pending
                    bottomBtnText = ` <i class="fa-solid fa-chevron-up"></i> ДЕЙСТВИЕ <i class="fa-solid fa-chevron-up" style="font-size:${fsChevron}; margin-left:2px;"></i>`;
                    bottomBtnAction = `onclick="toggleActionPanel('${historyId}', true, event)"`;
                    bottomBtnStyle = 'background: rgba(0,0,0,0.6); border-top: 1px solid var(--glass-border); color: #fff;';
                    
                    panelContent = `
                        <button onclick="exchangeItem(${historyId}, ${ticketVal}); toggleActionPanel('${historyId}', false, event);" style="box-sizing:border-box; background:rgba(255,255,255,0.05); border:1px solid var(--glass-border); color:#b0b0b0; border-radius:6px; font-size:${fsBtn}; font-weight:800; padding:4px; width:100%; margin-bottom:4px; line-height:1.3; transition:0.2s; backdrop-filter:blur(5px);">
                            ПРОДАТЬ ЗА<br><span style="color:#fff;">${ticketVal}</span> <i class="fa-solid fa-ticket" style="color:#ffd700; opacity:0.9;"></i>
                        </button>
                        <button id="withdraw-btn-${historyId}" onclick="withdrawItem(${historyId}, '${safeNameStr}'); toggleActionPanel('${historyId}', false, event);" style="box-sizing:border-box; background:rgba(42, 71, 94, 0.7); border:1px solid rgba(102, 192, 244, 0.4); color:#fff; border-radius:6px; font-size:${fsBtn}; font-weight:800; padding:4px; width:100%; line-height:1.3; transition:0.2s; backdrop-filter:blur(5px); box-shadow: 0 4px 15px rgba(27, 40, 56, 0.5);">
                            ЗАБРАТЬ В<br>STEAM
                        </button>
                    `;
                }

                const el = document.createElement('div');
                el.style.cssText = `position: relative; aspect-ratio: 1 / 1; display: flex; flex-direction: column; border-radius: 12px; border: ${cardBorder}; background: ${cardBgColor}; box-shadow: ${cardShadow}; overflow: hidden; transition: all 0.3s ease; box-sizing: border-box; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);`;
                
                el.innerHTML = `
                    ${overlayHtml}
                    <!-- Выезжающее меню -->
                    ${panelContent ? `
                    <div id="action-panel-${historyId}" style="position:absolute; bottom:-100%; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); backdrop-filter:blur(15px); -webkit-backdrop-filter:blur(15px); z-index:40; opacity:0; pointer-events:none; transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1); display:flex; flex-direction:column; justify-content:flex-end; padding:4px; box-sizing:border-box;">

                            <i class="fa-solid fa-xmark" style="color:var(--text-color-muted); font-size:${closeBtnIcon}; line-height:1; display:flex; margin-top:0.5px;"></i>

                            <div style="font-size:${fsTitle}; font-weight:800; color:#fff; overflow:hidden; text-overflow:ellipsis; line-height:1.2; ${nameDisplayStyle}">

                        ${panelContent}

                    <div onclick="openSupportModal('${historyId}', event)" style="position:absolute; top:4px; left:4px; width:${supportSize}; height:${supportSize}; border-radius:50%; background:rgba(255,255,255,0.05); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); color:var(--text-color-muted); font-weight:900; display:flex; justify-content:center; align-items:center; z-index:20; font-size:${supportFont}; border: 1px solid var(--glass-border); cursor:pointer;">!</div>

                    <div style="position:absolute; inset:0; display:flex; justify-content:center; align-items:center; overflow:hidden; z-index:1; padding-bottom: 15px;" onclick="${!isArchived ? `openFullscreenWeapon('${imageUrl}', '${safeNameStr}')` : ''}">
                        <img src="${imageUrl}" style="${imageStyles}">
                        ${centerOverlay}
                    </div>

                    <div style="position:absolute; bottom: ${isArchived ? '8px' : (currentGridSize === '2' ? '42px' : '32px')}; left:4px; z-index:10; display:flex; flex-direction:column; gap:0; pointer-events:none;">
                        ${!isArchived ? `
                            <div style="background:rgba(0,0,0,0.6); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); border:1px solid var(--glass-border); padding: 2px 5px; border-radius: 4px; font-size:${fsPrice}; font-weight:900; color:#fff;">
                                ${rawPrice} ₽

                    </div>
                    
                    ${bottomBtnText ? `

                        ${expirationHtml && !isExpired ? `<div style="font-size:${fsExp}; margin-bottom:2px;">${expirationHtml}</div>` : ''}

            const sellAllBtn = document.getElementById('sell-all-btn');
            if (sellAllBtn) {

                    sellAllBtn.innerHTML = `ПРОДАТЬ ВСЁ <i class="fa-solid fa-ticket" style="color: #ffd700; margin-left: 6px;"></i>`;

                    sellAllBtn.dataset.count = availableSellCount;

            }

            startAutoPoller(); // Запускаем автоматический поллер после отрисовки
        }

        // --- ГЛОБАЛЬНЫЙ ПОЛЛЕР ДЛЯ АКТИВНЫХ ТРЕЙДОВ ---
        let autoPoller = null;
        function startAutoPoller() {
            if (autoPoller) clearInterval(autoPoller);
            autoPoller = setInterval(async () => {
                // 🔥 ДОБАВЛЕН 'offer_sent', чтобы поллер чекал замороженные скины
                const activeItems = window.currentInventoryItems.filter(item => 
                    ['market_pending', 'auto_queued', 'processing', 'offer_sent'].includes((item.status || '').toLowerCase())
                );
                
                if (activeItems.length === 0) return;

                // Для каждого такого скина тихо вызываем проверку (без лоадеров)
                for (let item of activeItems) {
                    const hId = item.id || item.history_id;
                    try {
                        const res = await apiRequest('/api/v1/user/inventory/check_trade', 'POST', { history_id: hId }, true);
                        if ((res && res.success) || (res && res.new_status)) {
                            // Если статус изменился, тихо перерисовываем инвентарь
                            await refreshInventoryList();
                        }
                    } catch(e) {
                        // Ошибки поллера игнорим, чтобы не спамить
                    }
                }
            }, 40000); // Каждые 40 секунд чекаем только активные статусы
        }
        
        // --- ЛОГИКА КРЕАТИВНОГО ЛОАДЕРА ВЫВОДА ---
        let withdrawLoaderInterval;
        
        function showWithdrawLoader(itemName) {
            let loader = document.getElementById('withdraw-creative-loader');
            if (!loader) {
                loader = document.createElement('div');
                loader.id = 'withdraw-creative-loader';
                loader.className = 'withdraw-loader-overlay';
                loader.innerHTML = `
                    <i class="fa-solid fa-radar withdraw-loader-icon"></i>
                    <div class="withdraw-loader-title">Закупка предмета</div>
                    <div id="withdraw-loader-item" class="withdraw-loader-item"></div>
                    <div id="withdraw-loader-msg" class="withdraw-loader-msg">Инициализация...</div>
                `;
                document.body.appendChild(loader);
            }
            
            document.getElementById('withdraw-loader-item').innerText = itemName;
            loader.classList.add('active');
            
            const messages = [
                "Связываемся с маркетом...",
                "Ищем подходящий скин...",
                "Проверяем Float и качество...",
                "Договариваемся с продавцом...",
                "Выкупаем предмет...",
                "Создаем Steam Trade...",
                "Ожидаем ответа сети..."
            ];
            
            let msgIdx = 0;
            const msgEl = document.getElementById('withdraw-loader-msg');
            msgEl.innerText = messages[0];
            msgEl.style.opacity = '1';
            
            withdrawLoaderInterval = setInterval(() => {
                msgIdx = (msgIdx + 1) % messages.length;
                msgEl.style.opacity = '0'; 
                setTimeout(() => {
                    msgEl.innerText = messages[msgIdx];
                    msgEl.style.opacity = '1'; 
                }, 300);
            }, 2500);
        }

        function hideWithdrawLoader() {
            const loader = document.getElementById('withdraw-creative-loader');
            if (loader) {
                loader.classList.remove('active');
                if (withdrawLoaderInterval) clearInterval(withdrawLoaderInterval);
            }
        }

        // --- ФУНКЦИЯ "ЗАБРАТЬ" ---
        window.withdrawItem = function(historyId, itemName) {
            if (isUpdating) return;
            const lockKey = `claim_lock_${historyId}`;
            const lockTimestamp = localStorage.getItem(lockKey);
            
            if (lockTimestamp && (Date.now() - lockTimestamp < 30 * 60 * 1000)) {
                customAlert("⏳ Трейд уже в очереди! Steam может тупить, подождите еще немного.");
                return;
            }

            showCustomConfirmHTML(`Вывести "${itemName}" в Steam?`, async (closeConfirm) => {
                if (isUpdating) return; 
                isUpdating = true;
                
                closeConfirm();
                toggleActionPanel(historyId, false);
                showWithdrawLoader(itemName);

                try {
                    const res = await apiRequest('/api/v1/user/inventory/withdraw', 'POST', { history_id: historyId }, true);

                    if (res && res.status === 'offer_replacement') {
                        if (typeof openReplacementModal === 'function') {
                            openReplacementModal(historyId, res.options);
                        }
                    } else if (res && res.success) {
                        localStorage.setItem(lockKey, Date.now());
                        if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                        
                        document.getElementById('withdraw-loader-msg').innerText = "ТРЕЙД УСПЕШНО СОЗДАН!";
                        document.querySelector('.withdraw-loader-icon').className = "fa-solid fa-check-circle withdraw-loader-icon";
                        
                        setTimeout(() => customAlert(res.message, 'Супер!'), 500);
                    }
                    await refreshInventoryList();
                } catch (e) {
                    if (e.message !== 'Activity Lock') customAlert("Ошибка: " + e.message);
                } finally {
                    setTimeout(() => {
                        hideWithdrawLoader();
                        isUpdating = false;
                        const icon = document.querySelector('.withdraw-loader-icon');
                        if (icon) icon.className = "fa-solid fa-radar withdraw-loader-icon";
                    }, 500);
                }
            }, "ВЫВЕСТИ", "rgba(255,255,255,0.15)", "#fff");
        }
        
        window.sellAllItems = function() {
            const btn = document.getElementById('sell-all-btn');
            const amount = btn.dataset.amount;
            const count = btn.dataset.count;
            
            showCustomConfirmHTML(`Продать ВСЕ доступные скины<br><span style="font-size: 14px; font-weight: 600; color: var(--text-color-muted); display: inline-block; margin-top: 6px;">в количестве: ${count} шт.</span><br><span style="display: inline-block; margin-top: 6px;">за ${amount} <i class="fa-solid fa-ticket" style="color:#fff;"></i> ?</span>`, async (close) => {
                document.getElementById('global-loader').classList.add('active');
                try {
                    const res = await apiRequest('/api/v1/user/inventory/sell_all', 'POST');
                    customAlert(res.message || `Успешно! +${amount} билетов.`, 'Круто');
                    if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    close();
                    await refreshInventoryList();
                } catch (e) {
                    if (e.message !== 'Activity Lock') customAlert(e.message || "Ошибка при массовой продаже");
                    close();
                } finally {
                    document.getElementById('global-loader').classList.remove('active');
                }
            }, "ПРОДАТЬ ВСЁ", "rgba(255,255,255,0.15)", "#fff"); 
        }

        window.exchangeItem = function(historyId, amount) {
            showCustomConfirmHTML(`Продать скин за ${amount} <i class="fa-solid fa-ticket" style="color:#fff;"></i> ?`, async (close) => {
                document.getElementById('global-loader').classList.add('active');
                try {
                    const res = await apiRequest('/api/v1/user/inventory/sell', 'POST', { history_id: historyId });
                    customAlert(res.message || `Успешно! +${amount} билетов.`, 'Отлично');
                    if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    close();
                    await refreshInventoryList();
                } catch (e) {
                    if (e.message !== 'Activity Lock') customAlert(e.message || "Ошибка обмена");
                    close();
                } finally {
                    document.getElementById('global-loader').classList.remove('active');
                }
            }, "ПРОДАТЬ", "rgba(255,255,255,0.15)", "#fff");
        }

        window.checkTradeStatus = async function(historyId, isAuto = false) {
            const btn = document.getElementById(`check-btn-${historyId}`);
            if (btn && btn.style.opacity === '0.5') return; 

            const now = Date.now();
            if (checkCooldowns[historyId] && (now - checkCooldowns[historyId] < 55000)) { 
                if (!isAuto) customAlert("⏳ Проверять статус можно раз в минуту. Подождите немного.");
                return;
            }
            
            checkCooldowns[historyId] = now;
            
            if (btn) {
                btn.style.opacity = '0.5';
                const icon = document.getElementById(`check-icon-${historyId}`);
                if (icon) icon.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin-fast"></i>';
            }

            try {
                const res = await apiRequest('/api/v1/user/inventory/check_trade', 'POST', { history_id: historyId }, true);
                if (res && res.success) {
                    if (!isAuto) customAlert(res.message);
                    await refreshInventoryList();
                } else {
                    if (!isAuto) customAlert(res.message || "Оффер еще не принят. Посмотрите в Steam.");
                    if (res && res.new_status) {
                        await refreshInventoryList();
                    }
                }
            } catch (e) {
                if (!isAuto && e.message !== 'Activity Lock') customAlert("Ошибка: " + e.message);
            } finally {
                if (btn) {
                    btn.style.opacity = '1';
                    const icon = document.getElementById(`check-icon-${historyId}`);
                    if (icon) icon.innerHTML = '<i class="fa-solid fa-rotate"></i>';
                }
            }
        }

        window.initiateReplacementConfirm = function(historyId, assetid, itemName) {
            showCustomConfirmHTML(`Забрать "${itemName}"?`, async (closeConfirmWindow) => {
                if (isUpdating) return;
                isUpdating = true;     
                
                closeConfirmWindow(); 
                closeReplacementModal();
                document.getElementById('global-loader').classList.add('active');

                try {
                    const res = await apiRequest('/api/v1/user/inventory/confirm_replacement', 'POST', { history_id: historyId, assetid: assetid }, true);
                    if (res && res.success) {
                        if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                        customAlert('Замена успешно выбрана!');
                        await refreshInventoryList();
                    } else {
                        customAlert("❌ " + (res.message || "Ошибка замены"));
                    }
                } catch (e) {
                    if (e.message !== 'Activity Lock') customAlert("Ошибка: " + e.message);
                } finally {
                    document.getElementById('global-loader').classList.remove('active');
                    isUpdating = false; 
                }
            }, "ЗАБРАТЬ", "rgba(255,255,255,0.15)", "#fff"); 
        }

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>  
    <meta charset="UTF-8" />
    <title>Профиль | HATElavka SPA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --text-color-muted: #ebebf5;
            --primary-color: #34c759;
            --action-color: #0a84ff;
            --danger-color: #ff453a;
            
            /* iOS Liquid Glass Variables */
            --glass-bg: rgba(28, 28, 30, 0.45);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --glass-blur: blur(25px);
            
            --safe-top-gap: max(env(safe-area-inset-top, 24px) + 20px, 40px);
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at top right, #1a1a2e, var(--bg-color));
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Arial, sans-serif;
            overflow: hidden; 
            -webkit-tap-highlight-color: transparent;
        }

        .profile-skeleton {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* --- LIQUID GLASS HEADER --- */
        .profile-header {
            display: flex;
            align-items: center;
            padding: var(--safe-top-gap) 15px 20px 15px;
            gap: 15px;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            z-index: 10;
        }

        .avatar-container {
            width: 75px;
            height: 75px;
            border-radius: 22px; /* iOS squircle */
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            flex-shrink: 0;
            background: #1c1c1e;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1;
        }

        .user-icons {
            font-size: 16px;
            margin-bottom: 4px;
            display: flex;
            gap: 10px;
        }
        
        .user-icons i {
            cursor: pointer;
            transition: transform 0.2s, color 0.3s ease;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        
        .user-icons i:active { transform: scale(0.8); }

        .nickname {
            color: #fff;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .user-id {
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .settings-btn {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 6px 14px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            width: fit-content;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .settings-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.2); }

        /* --- LIQUID GLASS NAV --- */
        .nav-bar {
            display: flex;
            background: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            padding: 5px 10px;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 5;
        }

        .nav-item {
            flex: 1;
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: rgba(255,255,255,0.5);
            padding: 12px 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
        }

        .nav-item.active {
            color: #fff;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        
        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: 0; left: 20%; width: 60%; height: 3px;
            background: #fff;
            border-radius: 3px 3px 0 0;
            box-shadow: 0 -2px 8px rgba(255,255,255,0.5);
        }

        /* --- CONTENT AREA --- */
        #content-area {
            flex-grow: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 15px;
            position: relative;
        }

        .tab-loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: var(--text-color-muted);
            font-size: 28px;
        }
        
        /* --- LIQUID GLASS MODAL (SETTINGS) --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: 10000; display: flex; align-items: flex-end; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.visible { opacity: 1; pointer-events: auto; }
        
        .bottom-sheet {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-top: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            width: 100%; border-radius: 28px 28px 0 0;
            padding: 24px 20px 40px 20px;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .modal-overlay.visible .bottom-sheet { transform: translateY(0); }

        .sheet-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px;
        }
        .sheet-title { font-size: 20px; font-weight: 800; margin: 0; }
        .sheet-close {
            background: rgba(255,255,255,0.1); border: none; color: #fff;
            width: 32px; height: 32px; border-radius: 16px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* Карточки внутри настроек */
        .settings-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 16px;
            margin-bottom: 15px; display: flex; flex-direction: column; gap: 12px;
        }
        .settings-card-row { display: flex; justify-content: space-between; align-items: center; }
        
        .settings-icon-title { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; }
        .settings-status-text { font-size: 13px; color: var(--text-color-muted); word-break: break-all; }
        
        .ios-input {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; padding: 12px 15px; border-radius: 12px; font-size: 13px; outline: none;
            box-sizing: border-box; transition: 0.3s;
        }
        .ios-input:focus { border-color: var(--action-color); background: rgba(0,0,0,0.5); }
        .ios-input.error { border-color: var(--danger-color); box-shadow: 0 0 10px rgba(255,69,58,0.3); }

        .ios-btn {
            border: none; padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 700;
            cursor: pointer; transition: transform 0.2s; color: #fff;
        }
        .ios-btn:active { transform: scale(0.95); }
        .btn-twitch { background: #9146ff; }
        .btn-steam { background: var(--action-color); }
        .btn-danger { background: rgba(255,69,58,0.15); color: var(--danger-color); border: 1px solid rgba(255,69,58,0.3); }

        /* Loader Overlay (Global) */
        #global-loader {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
            z-index: 99999; display: none; align-items: center; justify-content: center;
        }
        #global-loader.active { display: flex; }
    </style>
</head>
<body>

        // --- УТИЛИТА ДЛЯ API ---
        async function apiRequest(endpoint, method = 'POST', body = null) {
            let url = endpoint;
            const options = { method, headers: { 'Content-Type': 'application/json' } };
            
            if (method === 'GET') {
                url += (url.includes('?') ? '&' : '?') + `initData=${encodeURIComponent(tg.initData)}`;
            } else {
                const b = body || {};
                b.initData = tg.initData;
                options.body = JSON.stringify(b);
            }
            
            const res = await fetch(url, options);
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Ошибка сервера');
            return data;
        }

        // --- ЛОГИКА НАСТРОЕК (1 В 1 СТАРЫЙ КОД) ---
        function openSettings() {
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            document.getElementById('settings-modal').classList.add('visible');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('visible');
        }

        async function saveTradeLink() {
            const input = document.getElementById('trade-link-input');
            let val = input.value.trim();
            
            // Валидация как в старом коде
            if (!val.startsWith("https://steamcommunity.com/tradeoffer/new") || !val.includes("partner=") || !val.includes("token=")) {
                input.classList.add('error');
                tg.showAlert("Укажите правильную Trade-ссылку из Steam!");
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                return;
            }
            
            input.classList.remove('error');
            document.getElementById('global-loader').classList.add('active');

            try {
                // БОЕВОЙ ЗАПРОС (Перенесли твой 1в1)
                // await apiRequest('/api/v1/user/trade_link/save', 'POST', { trade_link: val });
                
                // Обновляем локально для визуала
                currentUserData.trade_link = val;
                document.getElementById('icon-steam').style.color = 'var(--primary-color)';
                
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                tg.showPopup({message: 'Trade Link успешно сохранен!'});
                closeSettings();
            } catch (err) {
                tg.showAlert("Ошибка: " + err.message);
            } finally {
                document.getElementById('global-loader').classList.remove('active');
            }
        }

                // const res = await fetch(`/api/v1/auth/twitch_oauth?initData=${encodeURIComponent(tg.initData)}`);
                // const data = await res.json();
                // tg.openLink(data.url);
                // setTimeout(() => tg.close(), 500);

                // Эмуляция ответа сервера для теста:
                setTimeout(() => {
                    tg.showAlert("Здесь откроется OAuth ссылка Twitch (включи боевой запрос в коде)");
                    document.getElementById('global-loader').classList.remove('active');
                }, 500);

            } catch (err) {
                document.getElementById('global-loader').classList.remove('active');
                tg.showAlert("Ошибка: " + err.message);
            }
        }

        async function unlinkTwitch() {
            if (!confirm("Отвязать Twitch аккаунт?")) return;
            
            document.getElementById('global-loader').classList.add('active');
            try {
                // БОЕВОЙ ЗАПРОС (Перенесли твой 1в1)
                // await apiRequest('/api/v1/user/twitch/unlink', 'POST');
                
                currentUserData.twitch_login = null;
                document.getElementById('icon-twitch').style.color = 'var(--danger-color)';
                
                // Обновляем визуал в модалке
                document.getElementById('twitch-status-text').innerText = `Аккаунт не привязан`;
                document.getElementById('twitch-action-btn-container').innerHTML = `<button class="ios-btn btn-twitch" onclick="connectTwitch()">Привязать</button>`;
                
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

        // --- ЛОГИКА БЕСШОВНОЙ ПОДГРУЗКИ (SPA РОУТЕР) ---

            } catch (error) {
                contentArea.innerHTML = '<div style="text-align:center; color:var(--danger-color); padding-top: 50px;">Ошибка загрузки раздела</div>';
            }
        }

        navItems.forEach(item => {
            item.addEventListener('click', function() {
                navItems.forEach(nav => nav.classList.remove('active'));
                this.classList.add('active');
                const targetTab = this.getAttribute('data-target');
                loadTab(targetTab);
                if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            });
        });

        // Запуск приложения
        fetchAndApplyUserData().then(() => {
            // Грузим дефолтную вкладку (КЕЙСЫ) после загрузки юзера
            loadTab('cases');
        });

    </script>
</body>
</html>

<!-- Файл: /public/profile/promocodes.html -->
<div class="events-header-bar" style="margin-bottom: 12px; display: flex; justify-content: flex-start; align-items: center; padding: 0 4px; gap: 10px;">
    
    <!-- Левая часть: СОРТИРОВКА -->
    <div style="font-size: 10px; font-weight: 800; color: rgba(255,255,255,0.6); text-transform: uppercase;">Сортировка:</div>
    
    <!-- Правая часть: Выборка и кнопка -->
    <div style="display: flex; align-items: center; gap: 6px;">
        <select id="promocodes-sort-select" class="events-sort-select" onchange="window.applyPromocodesSort()">
            <option value="date_desc">Сначала новые</option>
            <option value="auto">Сначала авто</option>
            <option value="manual">Сначала ручные</option>
            <option value="admin">От админа</option>
        </select>
        
        <!-- Кнопка 1в1 как ПРОДАТЬ ВСЁ в инвентаре -->
        <button id="btn-clear-all-rewards" onclick="window.clearAllRewards()" style="display: none; align-items: center; justify-content: center; gap: 6px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); color: #fff; border: 1px solid rgba(255, 255, 255, 0.15); border-top: 1px solid rgba(255, 255, 255, 0.25); border-radius: 10px; padding: 6px 14px; font-size: 10px; font-weight: 800; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); font-family: inherit;">
            <i class="fa-solid fa-trash" style="color: #ff453a;"></i> ОЧИСТИТЬ ВСЁ
        </button>
        
        <span id="promo-count-badge" style="display: none;"></span>
    </div>
    

</div>

<!-- Контейнер для карточек -->
<div id="promocodes-list-container" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;"></div>

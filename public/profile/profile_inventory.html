<!-- Вкладка: ИНВЕНТАРЬ (profile_inventory.html) -->
<style>
    /* --- LIQUID GLASS INVENTORY STYLES --- */
    .inventory-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        width: 100%;
        animation: fadeIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* Карточка инвентаря в стиле жидкого стекла */
    .inv-card {
        background: rgba(28, 28, 30, 0.45);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 14px;
        padding: 8px;
        display: flex;
        flex-direction: column;
        position: relative;
        text-align: center;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .inv-card:active { transform: scale(0.95); }

    /* Верхняя полоска (ID слева, Дата справа) */
    .inv-card-top {
        display: flex;
        justify-content: space-between;
        font-size: 9px;
        color: rgba(255,255,255,0.6);
        margin-bottom: 6px;
        font-weight: 700;
    }

    /* Блок для картинки с тенью */
    .inv-card-img-wrap {
        height: 65px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 6px;
    }
    .inv-card-img-wrap img {
        max-width: 95%;
        max-height: 95%;
        object-fit: contain;
        filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
    }

    /* Цена */
    .inv-card-price {
        font-size: 11px;
        color: #ffd700;
        font-weight: 800;
        margin-bottom: 3px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* Название (Обрезается до 2 строк) */
    .inv-card-name {
        font-size: 10px;
        font-weight: 800;
        line-height: 1.2;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        margin-bottom: 6px;
        flex-grow: 1;
        text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    .inv-card-status { margin-top: auto; }

    /* Кнопки внутри карточки */
    .inv-btn {
        width: 100%;
        border: none;
        border-radius: 8px;
        font-size: 9px;
        font-weight: 800;
        padding: 8px 0;
        cursor: pointer;
        margin-top: 5px;
        transition: transform 0.2s, background 0.2s;
        text-transform: uppercase;
    }
    .inv-btn-claim { 
        background: #34c759; 
        color: #000; 
        box-shadow: 0 4px 12px rgba(52, 199, 89, 0.2); 
    }
    .inv-btn-sell { 
        background: rgba(255,255,255,0.1); 
        color: #fff; 
        border: 1px solid rgba(255,255,255,0.2); 
    }
    
    /* Стили для блюр-плашки отмены трейда */
    .inv-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
        border-radius: 14px;
        padding: 10px;
        box-sizing: border-box;
        text-align: center;
    }
    .inv-overlay-title { color: #ff3b30; font-size: 13px; font-weight: 800; text-transform: uppercase; line-height: 1.2; margin-bottom: 4px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    .inv-overlay-sub { color: #ebebf5; font-size: 9px; margin-bottom: 10px; line-height: 1.2; }
    .inv-overlay-btn { background: #34c759; color: #000; border: none; border-radius: 8px; font-size: 10px; font-weight: 800; padding: 8px 16px; cursor: pointer; transition: transform 0.1s; }
    .inv-overlay-btn:active { transform: scale(0.95); }

    /* Элементы сортировки и инфо-блок */
    .glass-panel {
        background: rgba(28, 28, 30, 0.45);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 16px;
        padding: 12px 15px;
        margin-bottom: 15px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    
    .glass-select {
        background: rgba(255,255,255,0.1);
        color: #fff;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 11px;
        font-weight: 700;
        outline: none;
        cursor: pointer;
    }
    .glass-select option { background: #1c1c1e; color: #fff; }

    /* --- МОДАЛКА ЗАМЕНЫ (REPLACEMENT) --- */
    #replacement-modal { z-index: 30000 !important; }
    
    .replacement-grid {
        display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
        margin-top: 15px; max-height: 60vh; overflow-y: auto; padding-bottom: 10px;
    }
    
    .replacement-card {
        background: rgba(28, 28, 30, 0.6);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border-radius: 16px; padding: 12px;
        border: 1px solid rgba(255, 255, 255, 0.15); 
        text-align: center; position: relative; display: flex; flex-direction: column; align-items: center;
        height: 180px; justify-content: space-between; overflow: hidden; z-index: 1; cursor: pointer; transition: transform 0.1s ease;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .replacement-card:active { transform: scale(0.95); }
    
    .replacement-img-wrapper { width: 100%; height: 85px; display: flex; align-items: center; justify-content: center; margin-top: 5px; z-index: 2; }
    .replacement-card img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 8px 15px rgba(0,0,0,0.5)); transform: scale(1.1) translateZ(0); transition: transform 0.2s ease; }
    .replacement-card.is-small-item img { transform: scale(1.4) translateY(-8px) translateZ(0); }
    .replacement-card:active img { transform: scale(1.2) translateZ(0); }
    .replacement-card.is-small-item:active img { transform: scale(1.5) translateY(-8px) translateZ(0); }

    .replacement-text-zone { width: 100%; z-index: 3; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; flex-grow: 1; padding-bottom: 5px; margin-top: auto; }
    .replacement-type { font-size: 8px; color: rgba(255,255,255,0.6); text-transform: uppercase; font-weight: 800; margin-bottom: 2px; text-align: center; }
    .replacement-name { font-size: 10px; font-weight: 800; color: #fff; line-height: 1.2; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,0.8); text-transform: uppercase; margin-bottom: 2px; }
    .replacement-condition { font-size: 9px; color: rgba(255,255,255,0.5); font-weight: 700; margin-top: auto; }
    
    .replacement-card::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.25; z-index: 0; pointer-events: none; }
    .replacement-card.blue { border-color: #4b69ff; } .replacement-card.blue::after { background: radial-gradient(circle at 50% 40%, #4b69ff 0%, transparent 75%); }
    .replacement-card.purple { border-color: #8847ff; } .replacement-card.purple::after { background: radial-gradient(circle at 50% 40%, #8847ff 0%, transparent 75%); }
    .replacement-card.pink { border-color: #d32ce6; } .replacement-card.pink::after { background: radial-gradient(circle at 50% 40%, #d32ce6 0%, transparent 75%); }
    .replacement-card.red { border-color: #eb4b4b; } .replacement-card.red::after { background: radial-gradient(circle at 50% 40%, #eb4b4b 0%, transparent 75%); }
    .replacement-card.gold { border-color: #ffd700; } .replacement-card.gold::after { background: radial-gradient(circle at 50% 40%, #ffd700 0%, transparent 75%); }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>

<!-- ИНФО-БЛОК ВЫВОДА (Стекло) -->
<div class="glass-panel" style="display: flex; align-items: center; gap: 12px; animation: fadeIn 0.2s ease;">
    <div style="background: rgba(10, 132, 255, 0.2); width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 1px solid rgba(10, 132, 255, 0.3);">
        <i class="fa-solid fa-clock" style="color: #0a84ff; font-size: 20px;"></i>
    </div>
    <div style="font-size: 12px; color: #fff; line-height: 1.4;">
        <b style="font-size: 13px;">Вывод скинов:</b> Обработка занимает до 30 минут.<br>
        <span style="color: rgba(255,255,255,0.6);">Не хотите ждать? Обменяйте скин на билеты.</span>
    </div>
</div>

<!-- ПАНЕЛЬ СОРТИРОВКИ -->
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 5px; animation: fadeIn 0.3s ease;">
    <div style="display: flex; align-items: center; gap: 8px;">
        <div style="font-size: 10px; font-weight: 800; color: rgba(255,255,255,0.6); text-transform: uppercase;">Сортировка:</div>
        <select id="inventory-sort-select" onchange="applyInventorySort()" class="glass-select">
            <option value="date_desc">Сначала новые</option>
            <option value="date_asc">Сначала старые</option>
            <option value="price_desc">Сначала дорогие</option>
            <option value="price_asc">Сначала дешевые</option>
            <option value="status">По статусу</option>
        </select>
    </div>

    <!-- Кнопка "Продать всё" -->
    <button id="sell-all-btn" onclick="sellAllItems()" style="background: rgba(255, 215, 0, 0.15); color: #ffd700; border: 1px solid rgba(255, 215, 0, 0.4); border-radius: 8px; padding: 6px 12px; font-size: 10px; font-weight: 800; cursor: pointer; display: none; transition: 0.2s ease; backdrop-filter: blur(10px);">
        <i class="fa-solid fa-tags"></i> ПРОДАТЬ ВСЁ
    </button>
</div>

<!-- КОНТЕЙНЕР ДЛЯ КАРТОЧЕК ИНВЕНТАРЯ -->
<div id="inventory-list-container" style="width: 100%; padding-bottom: 30px;">
    <!-- Сюда вставляются карточки .inv-card скриптом renderInventory() -->
    <div style="text-align: center; color: rgba(255,255,255,0.5); margin-top: 50px; font-size: 14px; font-weight: 600; animation: fadeIn 0.4s ease;">
        <i class="fa-solid fa-circle-notch fa-spin" style="margin-bottom: 10px; font-size: 28px; color: var(--action-color);"></i><br>
        Загрузка инвентаря...
    </div>
</div>

<!-- МОДАЛКА ВЫБОРА ЗАМЕНЫ (Скрыта по умолчанию, открывается через JS) -->
<div id="replacement-modal" class="modal-overlay" onclick="if(event.target===this) closeReplacementModal()">
    <div class="bottom-sheet" style="padding-bottom: 20px;">
        <div class="sheet-header" style="margin-bottom: 10px;">
            <h3 class="sheet-title">Выберите замену</h3>
            <button class="sheet-close" onclick="closeReplacementModal()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <p style="font-size: 12px; color: rgba(255,255,255,0.6); margin: 0 0 15px 0; text-align: left;">Оригинала нет, выберите любой скин — отправим его сразу:</p>
        
        <div id="replacement-options-list" class="replacement-grid">
            <!-- Карточки замен генерируются через JS -->
        </div>
    </div>
</div>

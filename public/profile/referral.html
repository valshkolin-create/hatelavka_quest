<style>
    /* Стили магазина под Liquid Glass */
    .shop-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-top: 15px;
        padding-bottom: 20px;
    }

    .shop-card {
        background: rgba(25, 25, 28, 0.5);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 4px 10px rgba(0,0,0,0.3);
        transition: transform 0.2s ease;
        position: relative;
    }

    .shop-card-img {
        width: 80px;
        height: 80px;
        object-fit: contain;
        margin-bottom: 10px;
        filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
    }

    .shop-card-title {
        font-size: 13px;
        font-weight: 800;
        color: #fff;
        text-align: center;
        margin-bottom: 4px;
        line-height: 1.2;
    }

    .shop-card-desc {
        font-size: 10px;
        color: var(--text-color-muted);
        text-align: center;
        margin-bottom: 12px;
        flex-grow: 1;
    }

    /* КНОПКИ */
    .shop-btn {
        width: 100%;
        border-radius: 10px;
        padding: 8px 4px;
        font-size: 11px;
        font-weight: 900;
        cursor: pointer;
        transition: 0.2s;
        text-transform: uppercase;
        border: 1px solid transparent;
        text-align: center;
    }
    
    .btn-buy {
        background: rgba(255, 215, 0, 0.1);
        border-color: rgba(255, 215, 0, 0.3);
        color: #ffd700;
    }
    .btn-buy:active { transform: scale(0.95); background: rgba(255, 215, 0, 0.2); }

    .btn-claim {
        background: rgba(52, 199, 89, 0.1);
        border-color: rgba(52, 199, 89, 0.3);
        color: #34c759;
    }
    .btn-claim:active { transform: scale(0.95); background: rgba(52, 199, 89, 0.2); }

    .btn-locked {
        background: rgba(0, 0, 0, 0.6);
        border-color: var(--glass-border);
        color: rgba(255,255,255,0.5);
        pointer-events: none;
    }

    /* Плашка ранга */
    .rank-banner {
        background: linear-gradient(135deg, rgba(255,215,0,0.1), rgba(255,140,0,0.05));
        border: 1px solid rgba(255,215,0,0.3);
        border-radius: 16px;
        padding: 12px 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
    }
</style>

<!-- Шапка магазина -->
<div class="events-header-bar" style="margin-bottom: 10px;">
    <h3 style="margin: 0; font-size: 18px; font-weight: 900; color: #fff; text-transform: uppercase; letter-spacing: 1px;">Награды</h3>
    <div style="background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 8px; padding: 4px 10px; font-size: 12px; font-weight: 800; color: #fff;">
        <span id="user-ref-balance"><i class="fa-solid fa-circle-notch fa-spin"></i></span> <i class="fa-solid fa-ticket" style="color: #ffd700;"></i>
    </div>
</div>

<!-- Баннер ранга -->
<div class="rank-banner" id="rank-banner-container" style="display: none;">
    <div>
        <div style="font-size: 10px; color: #ffd700; font-weight: 800; text-transform: uppercase;">Твой ранг: <span id="rank-name">Загрузка...</span></div>
        <div style="font-size: 14px; font-weight: 900; color: #fff; margin-top: 2px;">Приглашено: <span id="rank-count">0</span> чел.</div>
    </div>
    <i class="fa-solid fa-user-group" style="font-size: 24px; color: rgba(255,215,0,0.5);"></i>
</div>

<div id="shop-loader" style="display:flex; justify-content:center; padding: 40px;">
    <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 28px; color: var(--text-color-muted);"></i>
</div>

<div class="shop-grid" id="shop-items-container" style="display: none;">
    <!-- Сюда инжектятся карточки -->
</div>

<script>
    function getRankInfo(refs) {
        if (refs >= 100) return "Легенда";
        if (refs >= 50) return "Золото";
        if (refs >= 10) return "Серебро";
        return "Новичок";
    }

    async function initProfileShop() {
        try {
            // 🔥 ОБНОВЛЕННЫЙ URL 🔥
            const res = await window.apiRequest('/api/v1/profile/shop/items', 'POST', null, true);
            
            document.getElementById('user-ref-balance').innerText = res.user_balance || 0;
            document.getElementById('rank-count').innerText = res.referrals_count || 0;
            document.getElementById('rank-name').innerText = getRankInfo(res.referrals_count || 0);
            
            document.getElementById('rank-banner-container').style.display = 'flex';
            
            const container = document.getElementById('shop-items-container');
            document.getElementById('shop-loader').style.display = 'none';
            container.style.display = 'grid';
            
            if (!res.items || res.items.length === 0) {
                container.style.display = 'block';
                container.innerHTML = `
                    <div style="text-align:center; padding-top: 30px;">
                        <i class="fa-solid fa-store-slash" style="font-size: 40px; margin-bottom: 15px; opacity: 0.2; color: #fff;"></i>
                        <p style="font-size: 14px; color: var(--text-color-muted); font-weight: 600;">Наград пока нет</p>
                    </div>`;
                return;
            }

            container.innerHTML = '';
            
            res.items.forEach(item => {
                const fallbackImg = 'https://placehold.co/100x100/18181b/3f3f46?text=ITEM';
                
                let btnHtml = '';
                
                if (item.lock_reason === 'limit_reached') {
                    btnHtml = `<button class="shop-btn btn-locked"><i class="fa-solid fa-check"></i> ПОЛУЧЕНО</button>`;
                } else if (item.stock === 0) {
                    btnHtml = `<button class="shop-btn btn-locked">РАЗОБРАЛИ</button>`;
                } else if (item.is_locked) {
                    btnHtml = `<button class="shop-btn btn-locked"><i class="fa-solid fa-lock"></i> ${item.lock_reason}</button>`;
                } else {
                    if (item.price === 0) {
                        btnHtml = `<button class="shop-btn btn-claim" onclick="buyProfileShopItem(${item.id}, '${item.name}', 0)">ЗАБРАТЬ</button>`;
                    } else {
                        btnHtml = `<button class="shop-btn btn-buy" onclick="buyProfileShopItem(${item.id}, '${item.name}', ${item.price})">ЗА ${item.price} <i class="fa-solid fa-ticket"></i></button>`;
                    }
                }

                let badgeHtml = '';
                if (item.stock > 0) badgeHtml = `<div style="position:absolute; top:8px; left:8px; background:rgba(255,255,255,0.1); border-radius:6px; font-size:8px; padding:2px 6px; color:#fff; font-weight:800; border:1px solid var(--glass-border);">Остаток: ${item.stock}</div>`;
                
                let questBadge = '';
                if (item.unlock_type === 'quest' && !item.is_locked) {
                    questBadge = `<div style="position:absolute; top:8px; right:8px; color:#34c759; font-size:12px;"><i class="fa-solid fa-circle-check"></i></div>`;
                }

                container.innerHTML += `
                    <div class="shop-card">
                        ${badgeHtml}
                        ${questBadge}
                        <img src="${item.image_url || fallbackImg}" class="shop-card-img" alt="${item.name}">
                        <div class="shop-card-title">${item.name}</div>
                        <div class="shop-card-desc">${item.description || ''}</div>
                        ${btnHtml}
                    </div>
                `;
            });
            
        } catch (error) {
            document.getElementById('shop-loader').innerHTML = `<div style="color: #ff453a; font-size: 12px; font-weight: 800; text-align: center;">Ошибка загрузки наград</div>`;
        }
    }

    // 🔥 ОБНОВЛЕНО ИМЯ ФУНКЦИИ И URL 🔥
    window.buyProfileShopItem = function(itemId, itemName, price) {
        if (window.tg && window.tg.HapticFeedback) window.tg.HapticFeedback.impactOccurred('light');
        
        let confirmText = price === 0 
            ? `Забрать "${itemName}" бесплатно?` 
            : `Получить "${itemName}"?<br><span style="font-size: 11px; color: var(--text-color-muted);">Будет списано ${price} билетов</span>`;

        window.showCustomConfirmHTML(confirmText, async (close) => {
            document.getElementById('global-loader').classList.add('active');
            try {
                const res = await window.apiRequest('/api/v1/profile/shop/buy', 'POST', { item_id: itemId }, true);
                if (window.tg && window.tg.HapticFeedback) window.tg.HapticFeedback.notificationOccurred('success');
                
                window.customAlert(res.message || "Успешно получено! Ожидайте выдачи.", "Супер");
                
                await initProfileShop();
                close();
            } catch (e) {
                if (e.message !== 'Activity Lock') window.customAlert("Ошибка: " + e.message);
                close();
            } finally {
                document.getElementById('global-loader').classList.remove('active');
            }
        }, price === 0 ? "ЗАБРАТЬ" : "ПОЛУЧИТЬ", price === 0 ? "rgba(52, 199, 89, 0.15)" : "rgba(255, 215, 0, 0.15)", price === 0 ? "#34c759" : "#ffd700");
    };

    initProfileShop();
</script>

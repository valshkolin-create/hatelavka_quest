<html lang="ru">
<head>  
    <meta charset="UTF-8" />
    <title>Профиль | HATElavka SPA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --text-color-muted: #ebebf5;
            --primary-color: #34c759;
            --action-color: #0a84ff;
            --danger-color: #ff453a;
            
            /* iOS Liquid Glass Variables */
            --glass-bg: rgba(28, 28, 30, 0.45);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --glass-blur: blur(25px);
            
            /* Опустили шапку ниже, чтобы обойти системные элементы */
            --safe-top-gap: max(env(safe-area-inset-top, 24px) + 35px, 55px);
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); /* СТРОГО ЧЕРНЫЙ ФОН ИЗ ТЗ */
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Arial, sans-serif;
            overflow: hidden; 
            -webkit-tap-highlight-color: transparent;
        }

        .profile-skeleton {
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative; /* Для позиционирования кнопки наверх */
        }

        /* --- LIQUID GLASS HEADER --- */
        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between; /* Раскидываем инфо и историю */
            padding: var(--safe-top-gap) 15px 20px 15px;
            gap: 15px;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            z-index: 10;
        }

        .avatar-container {
            width: 75px;
            height: 75px;
            border-radius: 22px; /* iOS squircle */
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            flex-shrink: 0;
            background: #1c1c1e;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1;
        }

        .user-icons {
            font-size: 16px;
            margin-bottom: 4px;
            display: flex;
            gap: 10px;
        }
        
        .user-icons i {
            cursor: pointer;
            transition: transform 0.2s, color 0.3s ease;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        
        .user-icons i:active { transform: scale(0.8); }

        .nickname {
            color: var(--danger-color); /* КРАСНЫЙ НИК КАК НА СКРИНШОТЕ */
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .user-id {
            color: #b0b0b0;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .settings-btn {
            background-color: #1c1c1e;
            color: #fff;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 4px 12px;
            font-size: 10px;
            font-weight: 700;
            text-transform: lowercase;
            cursor: pointer;
            width: fit-content;
            transition: all 0.2s;
        }
        .settings-btn:active { transform: scale(0.95); background: #2c2c2e; }

        /* ВЕРНУЛИ ИСТОРИЮ КАК НА СКРИНШОТЕ */
        .history-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .history-title {
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .history-slots {
            display: flex;
            gap: 5px;
        }

        .h-slot {
            width: 32px;
            height: 32px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* --- LIQUID GLASS NAV --- */
        .nav-bar {
            display: flex;
            background: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            padding: 5px 10px;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 5;
        }

        .nav-item {
            flex: 1;
            text-align: center;
            font-size: 10px;
            font-weight: 800;
            color: rgba(255,255,255,0.5);
            padding: 12px 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            line-height: 1.1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
        }

        .nav-item.active {
            color: var(--danger-color); /* Красный цвет активной вкладки */
            font-weight: 800;
            text-shadow: 0 0 10px rgba(255,69,58,0.3);
        }
        
        /* --- CONTENT AREA --- */
        #content-area {
            flex-grow: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 15px;
            position: relative;
        }

        .tab-loader {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: var(--text-color-muted);
            font-size: 28px;
        }
        
        /* --- LIQUID GLASS MODAL (SETTINGS) --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: 10000; display: flex; align-items: flex-end; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.visible { opacity: 1; pointer-events: auto; }
        
        .bottom-sheet {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-top: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            width: 100%; border-radius: 28px 28px 0 0;
            padding: 24px 20px 40px 20px;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        .modal-overlay.visible .bottom-sheet { transform: translateY(0); }

        .sheet-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px;
        }
        .sheet-title { font-size: 20px; font-weight: 800; margin: 0; }
        .sheet-close {
            background: rgba(255,255,255,0.1); border: none; color: #fff;
            width: 32px; height: 32px; border-radius: 16px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* Карточки внутри настроек */
        .settings-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 16px;
            margin-bottom: 15px; display: flex; flex-direction: column; gap: 12px;
        }
        .settings-card-row { display: flex; justify-content: space-between; align-items: center; }
        
        .settings-icon-title { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; }
        .settings-status-text { font-size: 13px; color: var(--text-color-muted); word-break: break-all; }
        
        .ios-input {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; padding: 12px 15px; border-radius: 12px; font-size: 13px; outline: none;
            box-sizing: border-box; transition: 0.3s;
        }
        .ios-input:focus { border-color: var(--action-color); background: rgba(0,0,0,0.5); }
        .ios-input.error { border-color: var(--danger-color); box-shadow: 0 0 10px rgba(255,69,58,0.3); }

        .ios-btn {
            border: none; padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 700;
            cursor: pointer; transition: transform 0.2s; color: #fff;
        }
        .ios-btn:active { transform: scale(0.95); }
        .btn-twitch { background: #9146ff; }
        .btn-steam { background: var(--action-color); }
        .btn-danger { background: rgba(255,69,58,0.15); color: var(--danger-color); border: 1px solid rgba(255,69,58,0.3); }

        /* Loader Overlay (Global) */
        #global-loader {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
            z-index: 99999; display: none; align-items: center; justify-content: center;
        }
        #global-loader.active { display: flex; }

        /* Fullscreen Weapon Modal (Абсолютно поверх всего) */
        #fullscreen-weapon-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 999999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; backdrop-filter: blur(15px);
        }
        #fullscreen-weapon-modal.visible { opacity: 1; pointer-events: auto; }
        #fullscreen-weapon-img { max-width: 90%; max-height: 60%; object-fit: contain; filter: drop-shadow(0 10px 25px rgba(0,0,0,0.8)); transform: scale(1.15); }
        #fullscreen-weapon-name { color: #fff; font-size: 18px; font-weight: 800; margin-top: 20px; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,0.5); text-align: center; padding: 0 20px; }
        #fullscreen-weapon-close { position: absolute; top: max(env(safe-area-inset-top, 24px), 20px); right: 20px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* Кнопка скролла наверх */
        #scroll-to-top {
            position: absolute; bottom: 20px; right: 20px; width: 38px; height: 38px;
            background: rgba(28, 28, 30, 0.85); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center;
            font-size: 14px; cursor: pointer; z-index: 100; opacity: 0; pointer-events: none;
            backdrop-filter: blur(10px); transition: 0.3s box-shadow, 0.3s opacity;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>

                b.initData = tg.initData;
                options.body = JSON.stringify(b);
            }
            
            const res = await fetch(url, options);
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Ошибка сервера');
            return data;

        function getRarityData(rarity) {
            const r = (rarity || '').toLowerCase();
            if (r.includes('gold') || r.includes('крайне') || r.includes('knife')) return { color: '#ffd700', name: 'Крайне редкий' };
            if (r.includes('contraband') || r.includes('контрабандное')) return { color: '#e4ae39', name: 'Контрабандное' };
            if (r.includes('red') || r.includes('covert') || r.includes('ancient') || r.includes('тайное')) return { color: '#eb4b4b', name: 'Тайное' };
            if (r.includes('pink') || r.includes('classified') || r.includes('legendary') || r.includes('засекреченное')) return { color: '#d32ce6', name: 'Засекреченное' };
            if (r.includes('purple') || r.includes('restricted') || r.includes('mythical') || r.includes('запрещенное')) return { color: '#8847ff', name: 'Запрещённое' };
            if (r.includes('industrial') || r.includes('light_blue') || r.includes('промышленное')) return { color: '#5e98d9', name: 'Промышленное качество' };
            if (r.includes('blue') || r.includes('mil-spec') || r.includes('rare') || r.includes('армейское')) return { color: '#4b69ff', name: 'Армейское качество' };
            return { color: '#b0c3d9', name: 'Ширпотреб' };
        }

        // Делаем цвета более тусклыми и глубокими (alpha 0.05 - 0.1)
        function hexToRgba(hex, alpha) {
            let r = 0, g = 0, b = 0;
            hex = hex.replace('#', '');
            if (hex.length === 3) { r = parseInt(hex[0]+hex[0], 16); g = parseInt(hex[1]+hex[1], 16); b = parseInt(hex[2]+hex[2], 16); }
            else if (hex.length === 6) { r = parseInt(hex.substring(0,2), 16); g = parseInt(hex.substring(2,4), 16); b = parseInt(hex.substring(4,6), 16); }
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function parseSafeDate(dateStr) {
            if (!dateStr) return 0;
            if (typeof dateStr === 'number') return dateStr;
            let ms = new Date(dateStr).getTime();
            if (!isNaN(ms)) return ms;
            try {
                let cleanPart = String(dateStr).split('.')[0].split('+')[0];
                let safe = cleanPart.replace(' ', 'T');
                ms = new Date(safe).getTime();
                return isNaN(ms) ? 0 : ms;
            } catch(e) { return 0; }
        }

        function initCountdown(elementId, updatedAtStr) {
            const el = document.getElementById(elementId);
            if (!el) return;
            let dateStr = updatedAtStr.replace(' ', 'T');
            if (!dateStr.endsWith('Z') && !dateStr.includes('+')) dateStr += 'Z';
            
            const updateTime = new Date(dateStr).getTime();
            if (isNaN(updateTime)) { el.innerHTML = "ОБРАБОТКА"; return; }
            
            const expireTime = updateTime + (30 * 60 * 1000); 
            const historyId = elementId.replace('timer-', '');
            const getDistance = () => expireTime - new Date().getTime();

            if (getDistance() < 0) {
                el.innerHTML = `ВРЕМЯ ВЫШЛО`;
                if (el.dataset.intervalId) clearInterval(el.dataset.intervalId);
                return;
            }

            const updateTimer = () => {
                const distance = getDistance();
                if (distance < 0) {
                    el.innerHTML = `ПРОВЕРКА...`;
                    clearInterval(el.dataset.intervalId);
                    checkTradeStatus(historyId, true);
                    return;
                }
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                el.innerHTML = `${minutes}:${seconds < 10 ? '0' + seconds : seconds}`;
            };

            if (el.dataset.intervalId) clearInterval(el.dataset.intervalId);
            updateTimer();
            el.dataset.intervalId = setInterval(updateTimer, 1000);
        }

            container.style.display = 'grid';
            container.style.gridTemplateColumns = 'repeat(3, 1fr)';
            container.style.gap = '8px';
            container.style.width = '100%';
            
            // Сортировка с оригинальными текстами и аккуратным размером для ПК и Мобилок
            const sortSelect = document.getElementById('inventory-sort-select');
            if (sortSelect && !sortSelect.dataset.minified) {
                sortSelect.innerHTML = `
                    <option value="date_desc">Сначала новые</option>
                    <option value="date_asc">Сначала старые</option>
                    <option value="price_desc">Сначала дорогие</option>
                    <option value="price_asc">Сначала дешевые</option>
                    <option value="status">По статусу</option>
                `;
                sortSelect.style.fontSize = '10px';
                sortSelect.style.padding = '2px 6px';
                sortSelect.style.height = '24px';
                sortSelect.style.maxWidth = '115px';
                sortSelect.dataset.minified = 'true';
            }

            container.innerHTML = '';

            let availableSellCount = 0;
            let totalSellTickets = 0.0;

            if (itemsToRender.length === 0) {
                container.style.display = 'block';
                container.innerHTML = `
                    <div style="text-align:center; padding-top: 50px;">
                        <i class="fa-solid fa-box-open" style="font-size: 40px; margin-bottom: 15px; opacity: 0.3; color: #fff;"></i>
                        <p style="font-size: 14px; color: rgba(255,255,255,0.6); font-weight: 600;">Инвентарь пуст</p>
                    </div>`;
                return;
            }

            const sortType = sortSelect ? sortSelect.value : 'date_desc';
            const statusWeight = { 
                'auto_queued': 1, 'market_pending': 2, 'sent': 3, 'offer_sent': 4, 'pending': 5,
                'available': 6, 'processing': 7, 'failed': 8, 'canceled': 9,
                'received': 10, 'exchanged': 11, 'exchanged_swap': 12
            };

            itemsToRender.sort((a, b) => {
               const dateA = parseSafeDate(a.created_at || a.updated_at || a.date);
               const dateB = parseSafeDate(b.created_at || b.updated_at || b.date);
               const priceA = parseFloat(a.price_rub || a.price || 0);
               const priceB = parseFloat(b.price_rub || b.price || 0);
               const statA = (a.status || 'available').toLowerCase();
               const statB = (b.status || 'available').toLowerCase();
               const weightA = statusWeight[statA] || 99;
               const weightB = statusWeight[statB] || 99;

                if (sortType === 'status') {
                    if (weightA !== weightB) return weightA - weightB;
                    return dateB - dateA; 
                }
                const isAArchived = weightA >= 10;
                const isBArchived = weightB >= 10;
                if (isAArchived && !isBArchived) return 1;
                if (!isAArchived && isBArchived) return -1;

                if (sortType === 'date_desc') return dateB - dateA;
                if (sortType === 'date_asc') return dateA - dateB;
                if (sortType === 'price_desc') return priceB - priceA;
                if (sortType === 'price_asc') return priceA - priceB;
                return dateB - dateA;
            });

            itemsToRender.forEach(item => {
                const status = (item.status || 'available').toLowerCase();
                const historyId = item.id || item.history_id; 

                if (['available', 'pending', 'failed', 'canceled', 'received'].includes(status)) {
                    localStorage.removeItem(`claim_lock_${historyId}`);
                }

                const rData = getRarityData(item.rarity); 
                const isSwapped = item.is_swapped === true;
                const isReplaced = !!item.replaced_name && !isSwapped; 
                
                let displayName = (isReplaced || isSwapped) ? item.replaced_name : item.name;
                if (!displayName && item.details && item.details.includes('Выигрыш:')) {
                    displayName = item.details.replace('Выигрыш:', '').split('||')[0].trim();
                }
                if (!displayName) displayName = "Секретный приз";

                let cleanName = displayName;
                if (displayName.includes('|')) cleanName = displayName.split('|').slice(1).join('|').trim();
                
                let imageUrl = item.image_url;
                if (!imageUrl || imageUrl.includes('null')) imageUrl = 'https://placehold.co/100x100/18181b/3f3f46?text=?';
                
                let strPrice = String(item.price_rub || item.price || "0").replace(',', '.');
                let strReplaced = String(item.replaced_price || "0").replace(',', '.');
                let parsedBasePrice = parseFloat(strPrice) || 0;
                let parsedReplPrice = parseFloat(strReplaced) || 0;
                const rawPrice = (isReplaced || isSwapped) && parsedReplPrice > 0 ? parsedReplPrice : parsedBasePrice;
                const ticketVal = parseFloat((rawPrice * 0.5).toFixed(2));
                const safeNameStr = displayName.replace(/'/g, "\\'");

                if (['available', 'pending', 'failed', 'canceled'].includes(status)) {
                    availableSellCount++;
                    totalSellTickets += ticketVal;
                }

                // --- ТЁМНЫЙ ПРЕМИУМ ДИЗАЙН ---
                let cardBgColor = hexToRgba(rData.color, 0.05); 
                let cardBorder = `1px solid rgba(255,255,255, 0.05)`;
                let cardShadow = `inset 0 0 20px rgba(0,0,0,0.6), 0 4px 10px rgba(0,0,0,0.5)`;
                
                let isArchived = ['received', 'exchanged', 'exchanged_swap', 'failed'].includes(status);
                let centerOverlay = '';
                
                // Базовый размер для оружия
                let imgTransform = 'scale(1.3) translateX(15%) translateY(0%)'; 

                // Уменьшаем размер и ставим по центру для музыки, наклеек, агентов и т.д.
                // Расширенная проверка: ищем "Music Kit" и другие мелкие предметы
                const nameCheck = displayName.toLowerCase();
                const isSmallItem = nameCheck.includes('music kit') || nameCheck.includes('музык') || nameCheck.includes('наклейка') || nameCheck.includes('агент') || nameCheck.includes('нашивка') || nameCheck.includes('значок') || nameCheck.includes('граффити');

                // Базовый размер для оружия
                let imgTransform = 'scale(1.3) translateX(15%) translateY(0%)'; 

                if (isSmallItem) {
                    // Делаем еще меньше (0.65) и ставим !important, чтобы статусы это не перебивали
                    imgTransform = 'scale(0.65) translateY(-5%) translateX(0) !important'; 
                }

                let imageStyles = `width:90%; height:90%; object-fit:contain; filter:drop-shadow(0 8px 15px rgba(0,0,0,0.6)) brightness(1.2); transition: all 0.4s ease; transform: ${imgTransform};`;
                
                // Статусные изменения (Архив и Ошибки)
                if (isArchived) {
                    imageStyles += ` opacity: 0.15; filter: blur(2px) grayscale(100%); transform: scale(1);`;
                    if (status === 'received') {
                        cardBgColor = 'rgba(52, 199, 89, 0.05)';
                        centerOverlay = `<div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:900; color:#32d74b; text-shadow:0 2px 5px rgba(0,0,0,0.8); text-transform:uppercase; text-align:center; z-index:5;">Успешно<br>выведен</div>`;
                    } else if (status === 'exchanged') {
                        cardBgColor = 'rgba(255, 149, 0, 0.05)';
                        centerOverlay = `<div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:10px; font-weight:900; color:#fff; text-shadow:0 2px 5px rgba(0,0,0,0.8); text-transform:uppercase; text-align:center; z-index:5; line-height: 1.3;"><span>Продан за</span><span style="color:#ffd700; font-size:11px;">${ticketVal} <i class="fa-solid fa-ticket"></i></span></div>`;
                    } else if (status === 'exchanged_swap') {
                        cardBgColor = 'rgba(255, 215, 0, 0.05)';
                        centerOverlay = `<div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:900; color:#ffd700; text-shadow:0 2px 5px rgba(0,0,0,0.8); text-transform:uppercase; text-align:center; z-index:5;">В свапе</div>`;
                    } else if (status === 'failed') {
                        cardBgColor = 'rgba(255, 69, 58, 0.05)';
                        centerOverlay = `<div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:900; color:#ff453a; text-shadow:0 2px 5px rgba(0,0,0,0.8); text-transform:uppercase; text-align:center; z-index:5;">Ошибка</div>`;
                    }
                } 
                // Статусные изменения (Процесс)
                else if (status === 'auto_queued') {
                    cardBorder = `1px solid rgba(10, 132, 255, 0.3)`;
                    imageStyles += ` opacity: 0.5; filter: grayscale(50%); transform: scale(1);`;
                } else if (status === 'market_pending') {
                    cardBorder = `1px solid rgba(191, 90, 242, 0.3)`;
                    imageStyles += ` opacity: 0.5; filter: grayscale(50%); transform: scale(1);`;
                } else if (status === 'offer_sent' || status === 'sent') {
                    cardBorder = `1px solid rgba(52, 199, 89, 0.4)`;
                    cardShadow = `inset 0 0 20px rgba(52, 199, 89, 0.05), 0 4px 15px rgba(52, 199, 89, 0.1)`;
                }

                // Сгорание
                let expirationHtml = '';
                let isExpired = false;
                const updateTimeMs = parseSafeDate(item.updated_at || item.created_at);

                if (['available', 'pending', 'canceled'].includes(status)) {
                    const source = item.source || 'shop';
                    const amnestyTimestamp = new Date('2026-07-15T00:00:00+03:00').getTime();
                    let expireTimeMs = updateTimeMs < amnestyTimestamp 
                        ? amnestyTimestamp + (14 * 24 * 60 * 60 * 1000) 
                        : updateTimeMs + ((['raffle', 'auction', 'twitch'].includes(source) ? 3 : 14) * 24 * 60 * 60 * 1000);
                    
                    if (updateTimeMs > 0) {
                        const timeLeftMs = expireTimeMs - Date.now();
                        if (timeLeftMs > 0) {
                            const days = Math.floor(timeLeftMs / (1000 * 60 * 60 * 24));
                            const hours = Math.floor((timeLeftMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                            let timeStr = days > 0 ? `${days}д ${hours}ч` : `${hours}ч`;
                            if (days === 0 && hours === 0) timeStr = `${Math.floor((timeLeftMs % (1000 * 60 * 60)) / (1000 * 60))}м`;
                            expirationHtml = `Сгорит: ${timeStr}`; // <-- Убрали кавычки и div, отдаем чистый текст
                        } else {
                            isExpired = true;
                            expirationHtml = `СГОРЕЛ`;
                        }
                    }
                }

                // Нижняя кнопка-триггер и выезжающее меню (Action Panel)
                let bottomBtnText = 'ДЕЙСТВИЕ <i class="fa-solid fa-chevron-up" style="font-size:7px; margin-left:2px;"></i>';
                let bottomBtnAction = `onclick="toggleActionPanel('${historyId}', true, event)"`;
                let panelContent = '';
                
                if (isArchived) {
                    bottomBtnText = ''; // В архиве кнопки нет
                } else if (isExpired) {
                    bottomBtnText = 'СГОРЕЛ';
                    bottomBtnAction = '';
                } else if (status === 'market_pending') {
                    bottomBtnText = 'ОБНОВИТЬ';
                    bottomBtnAction = `onclick="checkTradeStatus(${historyId})"`;
                } else if (status === 'processing') {
                    bottomBtnText = 'ОБРАБОТКА';
                    bottomBtnAction = '';
                } else if (status === 'auto_queued') {
                    bottomBtnText = 'ПОИСК...';
                    bottomBtnAction = '';
                } else if (status === 'offer_sent' || status === 'sent') {
                    const timerElementId = `timer-${historyId}`;
                    bottomBtnText = `<span id="${timerElementId}">--:--</span> <i class="fa-solid fa-chevron-up" style="font-size:7px; margin-left:2px;"></i>`;
                    
                    panelContent = `
                        <button onclick="window.open('https://steamcommunity.com/my/tradeoffers/', '_blank'); toggleActionPanel('${historyId}', false, event);" style="box-sizing:border-box; background:rgba(52,199,89,0.1); border:1px solid rgba(52,199,89,0.3); color:#32d74b; border-radius:6px; font-size:8px; font-weight:800; padding:4px; width:100%; margin-bottom:4px; line-height:1.3;">ОТКРЫТЬ<br>STEAM</button>
                        <button id="check-btn-${historyId}" onclick="checkTradeStatus(${historyId}); toggleActionPanel('${historyId}', false, event);" style="box-sizing:border-box; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15); color:#fff; border-radius:6px; font-size:8px; font-weight:800; padding:4px; width:100%; line-height:1.3;">ОБНОВИТЬ<br>СТАТУС</button>
                    `;
                    setTimeout(() => { if (typeof initCountdown === 'function') initCountdown(timerElementId, item.updated_at); }, 50);
                } else {
                    // Available / Pending
                    panelContent = `
                        <button onclick="exchangeItem(${historyId}, ${ticketVal}); toggleActionPanel('${historyId}', false, event);" style="box-sizing:border-box; background:rgba(255,149,0,0.1); border:1px solid rgba(255,149,0,0.3); color:#ff9f0a; border-radius:6px; font-size:8px; font-weight:800; padding:4px; width:100%; margin-bottom:4px; line-height:1.3;">ПРОДАТЬ ЗА ${ticketVal}<br><i class="fa-solid fa-ticket"></i></button>
                        <button id="withdraw-btn-${historyId}" onclick="withdrawItem(${historyId}, '${safeNameStr}'); toggleActionPanel('${historyId}', false, event);" style="box-sizing:border-box; background:rgba(10,132,255,0.1); border:1px solid rgba(10,132,255,0.3); color:#0a84ff; border-radius:6px; font-size:8px; font-weight:800; padding:4px; width:100%; line-height:1.3;">ЗАБРАТЬ В<br>STEAM</button>
                    `;
                }

                const el = document.createElement('div');
                // Карточка-квадрат
                el.style.cssText = `position: relative; aspect-ratio: 1 / 1; display: flex; flex-direction: column; border-radius: 12px; border: ${cardBorder}; background: ${cardBgColor}; box-shadow: ${cardShadow}; overflow: hidden; transition: all 0.3s ease; box-sizing: border-box;`;
                
               el.innerHTML = `
                    <!-- Выезжающее меню "Действие" -->
                    ${panelContent ? `
                    <div id="action-panel-${historyId}" style="position:absolute; bottom:-100%; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); backdrop-filter:blur(10px); z-index:40; opacity:0; pointer-events:none; transition:all 0.3s cubic-bezier(0.4, 0, 0.2, 1); display:flex; flex-direction:column; justify-content:flex-end; padding:4px; box-sizing:border-box;">
                        <div onclick="toggleActionPanel('${historyId}', false, event)" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:-1; cursor:pointer;"></div>
                        <i class="fa-solid fa-chevron-down" onclick="toggleActionPanel('${historyId}', false, event)" style="align-self:center; font-size:12px; color:#fff; padding-bottom:6px; cursor:pointer;"></i>
                        ${panelContent}
                    </div>
                    ` : ''}

                    <!-- Кнопка вызова Поддержки (!) УМЕНЬШЕННАЯ -->
<div onclick="openSupportModal('${historyId}', event)" style="position:absolute; top:4px; left:4px; width:18px; height:18px; border-radius:50%; background:rgba(0,0,0,0.4); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); color:rgba(255,255,255,0.8); font-weight:900; display:flex; justify-content:center; align-items:center; z-index:20; font-size:10px; box-shadow: 0 2px 8px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.15); cursor:pointer;">!</div>
                    <!-- Оружие -->
                    <div style="position:absolute; inset:0; display:flex; justify-content:center; align-items:center; overflow:hidden; z-index:1; padding-bottom: 10px;" onclick="${!isArchived ? `openFullscreenWeapon('${imageUrl}', '${safeNameStr}')` : ''}">
                        <img src="${imageUrl}" style="${imageStyles}">
                        ${centerOverlay}
                    </div>

                    <!-- РАЗДЕЛЬНЫЕ ПЛАШКИ С ТЕКСТОМ (Приподняты над кнопкой) -->
                    <div style="position:absolute; bottom: ${isArchived ? '8px' : '30px'}; ${isArchived ? 'left:0; width:100%; align-items:center;' : 'left:4px; align-items:flex-start;'} z-index:10; display:flex; flex-direction:column; gap:0; pointer-events:none;">
                        <!-- Плашка названия -->
                        <div style="background:rgba(0,0,0,0.5); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,0.05); padding: 2px 5px; border-radius: 4px; font-size:9px; font-weight:900; color:#fff; white-space:nowrap; max-width:80px; overflow:hidden; text-overflow:ellipsis; margin-bottom: 1px;">
                            ${cleanName}
                        </div>
                        
                        ${!isArchived ? `
                            <!-- Плашка цены -->
                            <div style="background:rgba(0,0,0,0.5); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,0.05); padding: 2px 5px; border-radius: 4px; font-size:9px; font-weight:900; color:#ffd700;">
                                ${rawPrice} ₽
                            </div>
                        ` : ''}
                    </div>
                    
                    <!-- Кнопка ДЕЙСТВИЕ в самом низу (ФОН УМЕНЬШЕН ПО ВЫСОТЕ) -->
                    ${bottomBtnText ? `
                    <div ${bottomBtnAction} style="position:absolute; bottom:0; left:0; width:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; background:rgba(0,0,0,0.4); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); border-top:1px solid rgba(255,255,255,0.05); color:#fff; font-size:8px; font-weight:800; padding:0px 0; cursor:pointer; transition:0.2s; z-index:15;">
                        ${expirationHtml && !isExpired ? `<span style="color:#ff4c4c; font-size:7px; font-weight:900; margin-bottom:1px;">${expirationHtml}</span>` : ''}
                        <span style="display:flex; align-items:center; gap: 3px;">${bottomBtnText}</span>
                    </div>
                    ` : ''}
                `;
                container.appendChild(el);
            });

            // Обновляем кнопку ПРОДАТЬ ВСЁ (Уменьшенный размер и выравнивание)
            const sellAllBtn = document.getElementById('sell-all-btn');
            if (sellAllBtn) {
                if (availableSellCount > 0) {
                    sellAllBtn.style.display = 'flex';
                    sellAllBtn.style.alignItems = 'center';
                    sellAllBtn.innerHTML = `<i class="fa-solid fa-tags" style="margin-right: 4px;"></i> ПРОДАТЬ (${availableSellCount})`;
                    sellAllBtn.style.fontSize = '9px';
                    sellAllBtn.style.padding = '0 8px';
                    sellAllBtn.style.height = '24px';
                    sellAllBtn.dataset.amount = totalSellTickets.toFixed(2);
                    sellAllBtn.dataset.count = availableSellCount;
                } else {
                    sellAllBtn.style.display = 'none';
                }
            }
        }

        // --- УТИЛИТА ПОДТВЕРЖДЕНИЯ (CUSTOM CONFIRM) ---
        function showCustomConfirmHTML(text, onConfirmCallback, btnText = 'Да', btnColor = '#0a84ff') {
            const overlay = document.createElement('div'); 
            overlay.className = 'modal-overlay visible'; 
            overlay.style.alignItems = 'center';
            
            const box = document.createElement('div'); 
            box.style.cssText = `background: var(--glass-bg); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border: 1px solid var(--glass-border); border-radius: 24px; padding: 24px; width: 85%; max-width: 320px; text-align: center; color: white; box-shadow: var(--glass-shadow); transform: scale(0.95); animation: popIn 0.2s forwards;`;
            
            box.innerHTML = `
                <h3 style="margin: 0 0 20px; font-size: 18px; font-weight: 800; line-height: 1.4;">${text}</h3>
                <div style="display: flex; gap: 12px;">
                    <button id="custom-cancel-btn" style="flex: 1; padding: 12px; border: none; border-radius: 14px; background: rgba(255,255,255,0.1); color: white; font-size: 14px; font-weight: 700; cursor: pointer;">Отмена</button>
                    <button id="custom-confirm-btn" style="flex: 1; padding: 12px; border: none; border-radius: 14px; background: ${btnColor}; color: #fff; font-size: 14px; font-weight: 800; cursor: pointer; text-shadow: 0 1px 2px rgba(0,0,0,0.3);">${btnText}</button>
                </div>`;
                
            overlay.appendChild(box); 
            document.body.appendChild(overlay);
            
            const close = () => { overlay.style.opacity = '0'; setTimeout(() => overlay.remove(), 300); };
            overlay.querySelector('#custom-cancel-btn').onclick = close;
            
            const confirmBtn = overlay.querySelector('#custom-confirm-btn');
            confirmBtn.onclick = () => {
                if (confirmBtn.dataset.clicked) return;
                confirmBtn.dataset.clicked = "true";
                confirmBtn.style.transform = "scale(0.95)";
                onConfirmCallback(close);
            };
        }

        // --- ДЕЙСТВИЯ С ИНВЕНТАРЕМ ---
        window.acknowledgeCancel = function(historyId) {
            localStorage.setItem(`ack_cancel_${historyId}`, 'true');
            if (typeof loadData === 'function') loadData(true);
        };

        window.withdrawItem = function(historyId, itemName) {
            if (isUpdating) return;
            const lockKey = `claim_lock_${historyId}`;
            const lockTimestamp = localStorage.getItem(lockKey);
            
            if (lockTimestamp && (Date.now() - lockTimestamp < 30 * 60 * 1000)) {
                tg.showAlert("⏳ Трейд уже в очереди! Steam может тупить, подождите еще немного.");
                return;
            }

            showCustomConfirmHTML(`Вывести "${itemName}" в Steam?`, async (closeConfirm) => {
                isUpdating = true;
                const btn = document.getElementById(`withdraw-btn-${historyId}`);
                if (btn) btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';

                try {
                    const res = await apiRequest('/api/v1/user/inventory/withdraw', 'POST', { history_id: historyId });
                    closeConfirm();

                    if (res && res.status === 'offer_replacement') {
                        if (typeof openReplacementModal === 'function') openReplacementModal(historyId, res.options);
                    } else if (res && res.success) {
                        localStorage.setItem(lockKey, Date.now());
                        if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                        tg.showPopup({message: res.message});
                    }
                    if (typeof loadData === 'function') await loadData(true);
                } catch (e) {
                    closeConfirm();
                    tg.showAlert("Ошибка: " + e.message);
                    if (btn) btn.innerHTML = 'ЗАБРАТЬ В STEAM';
                } finally {
                    isUpdating = false;
                }
            }, "ВЫВЕСТИ", "#34c759");
        }

        window.sellAllItems = function() {
            const btn = document.getElementById('sell-all-btn');
            const amount = btn.dataset.amount;
            const count = btn.dataset.count;
            
            // Заменили эмодзи на иконку билета
            showCustomConfirmHTML(`Продать ВСЕ доступные скины (${count} шт.) за ${amount} <i class="fa-solid fa-ticket" style="color:#ffd700;"></i> ?`, async (close) => {
                document.getElementById('global-loader').classList.add('active');
                try {
                    const res = await apiRequest('/api/v1/user/inventory/sell_all', 'POST');
                    tg.showAlert(res.message || `Успешно! +${amount} билетов.`);
                    if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    close();
                    if (typeof loadData === 'function') await loadData(true);
                } catch (e) {
                    tg.showAlert(e.message || "Ошибка при массовой продаже");
                    close();
                } finally {
                    document.getElementById('global-loader').classList.remove('active');
                }
            }, "ПРОДАТЬ ВСЁ", "#ffd700");
        }

        window.exchangeItem = function(historyId, amount) {
            // Заменили эмодзи на иконку билета
            showCustomConfirmHTML(`Продать скин за ${amount} <i class="fa-solid fa-ticket" style="color:#ffd700;"></i> ?`, async (close) => {
                document.getElementById('global-loader').classList.add('active');
                try {
                    const res = await apiRequest('/api/v1/user/inventory/sell', 'POST', { history_id: historyId });
                    tg.showAlert(res.message || `Успешно! +${amount} билетов.`);
                    if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    close();
                    if (typeof loadData === 'function') await loadData(true);
                } catch (e) {
                    tg.showAlert(e.message || "Ошибка обмена");
                    close();
                } finally {
                    document.getElementById('global-loader').classList.remove('active');
                }
            }, "ПРОДАТЬ", "#34c759");
        }

        window.checkTradeStatus = async function(historyId, isAuto = false) {
            const btn = document.getElementById(`check-btn-${historyId}`);
            if (btn && btn.style.opacity === '0.5') return; 

            const now = Date.now();
            if (checkCooldowns[historyId] && (now - checkCooldowns[historyId] < 55000)) { 
                if (!isAuto) tg.showPopup({message: "⏳ Проверять статус можно раз в минуту. Подождите немного."});
                return;
            }
            
            checkCooldowns[historyId] = now;
            
            if (btn) {
                btn.style.opacity = '0.5';
                btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
            }

            try {
                const res = await apiRequest('/api/v1/user/inventory/check_trade', 'POST', { history_id: historyId });
                if (res && res.success) {
                    if (!isAuto) tg.showPopup({message: res.message});
                } else {
                    if (!isAuto) tg.showPopup({message: res.message || "Оффер еще не принят. Посмотрите в Steam."});
                }
                
                if (typeof loadData === 'function') await loadData(true);
            } catch (e) {
                if (!isAuto) tg.showAlert("Ошибка: " + e.message);
            } finally {
                if (btn) {
                    btn.innerHTML = 'ОБНОВИТЬ СТАТУС';
                    btn.style.opacity = '1';
                }
            }
        }

        // --- ОКНО ЗАМЕНЫ (REPLACEMENT MODAL) ---
        window.openReplacementModal = function(historyId, options) {
            const modal = document.getElementById('replacement-modal');
            const container = document.getElementById('replacement-options-list');
            if(!modal || !container) return;
            
            container.innerHTML = options.map(item => {
                let r = (item.rarity || '').toLowerCase();
                let rClass = 'blue';
                if (r.includes('purple')) rClass = 'purple';
                else if (r.includes('pink')) rClass = 'pink';
                else if (r.includes('red')) rClass = 'red';
                else if (r.includes('gold')) rClass = 'gold';

                const nameParts = item.name_ru.split('|');
                const itemType = nameParts.length > 1 ? nameParts[0].trim() : '';
                const cleanName = nameParts.length > 1 ? nameParts.slice(1).join('|').trim() : item.name_ru.trim();
                const safeName = item.name_ru.replace(/'/g, "");
                const lowerType = itemType.toLowerCase();
                let sizeClass = (lowerType.includes('наклейка') || lowerType.includes('граффити') || lowerType.includes('нашивка') || lowerType.includes('значок')) ? 'is-small-item' : '';

                return `
                    <div class="replacement-card ${rClass} ${sizeClass}" onclick="initiateReplacementConfirm(${historyId}, '${item.assetid}', '${safeName}')">
                        <div class="replacement-img-wrapper"><img src="${item.icon_url}" loading="lazy"></div>
                        <div class="replacement-text-zone">
                            ${itemType ? `<div class="replacement-type">${itemType}</div>` : ''}
                            <div class="replacement-name">${cleanName}</div>
                            <div class="replacement-condition">${item.condition || '-'}</div>
                        </div>
                    </div>
                `;
            }).join('');

            modal.classList.add('visible');
        }

        window.closeReplacementModal = function() {
            const modal = document.getElementById('replacement-modal');
            if(modal) modal.classList.remove('visible');
        }

        window.initiateReplacementConfirm = function(historyId, assetid, itemName) {
            showCustomConfirmHTML(`Забрать "${itemName}"?`, async (closeConfirmWindow) => {
                if (isUpdating) return;
                isUpdating = true;     
                
                closeConfirmWindow(); 
                closeReplacementModal();
                document.getElementById('global-loader').classList.add('active');

                try {
                    const res = await apiRequest('/api/v1/user/inventory/confirm_replacement', 'POST', { history_id: historyId, assetid: assetid });
                    if (res && res.success) {
                        if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                        tg.showPopup({message: 'Замена успешно выбрана!'});
                        if (typeof loadData === 'function') await loadData(true);
                    } else {
                        tg.showAlert("❌ " + (res.message || "Ошибка замены"));
                    }
                } catch (e) {
                    tg.showAlert("Ошибка: " + e.message);
                } finally {
                    document.getElementById('global-loader').classList.remove('active');
                    isUpdating = false; 
                }
            }, "ЗАБРАТЬ", "#ffd700"); 
        }

        // =========================================================
        // КОНЕЦ ЛОГИКИ ИНВЕНТАРЯ
        // =========================================================

    </script>
</body>
